<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>メッセージカード 3D ビューア</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    .gallery-glass {
      background: rgba(255, 253, 249, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(226, 221, 210, 0.9);
      box-shadow: 0 10px 30px rgba(28, 30, 86, 0.07), 0 1px 3px rgba(28, 30, 86, 0.04);
    }
    .cam-btn {
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cam-btn:hover {
      transform: translateY(-1px);
    }
    .cam-btn:active {
      transform: translateY(0) scale(0.97);
    }
    .cam-btn.active {
      background-color: #233396;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(35, 51, 150, 0.28);
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="canvas-container"></div>

  <!-- Loading Spinner (Auto-dismissed immediately upon first render) -->
  <div id="loading-overlay" class="fixed inset-0 z-30 flex items-center justify-center transition-opacity duration-300 pointer-events-none">
    <div class="w-8 h-8 border-2 border-indigo-200/60 border-t-[#233396] rounded-full animate-spin"></div>
  </div>

  <!-- Error Message Box -->
  <div id="error-box" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4 pointer-events-none">
    <div class="bg-white/95 backdrop-blur rounded-2xl p-5 max-w-sm shadow-lg border border-slate-200 text-center pointer-events-auto">
      <h2 class="text-sm font-bold text-slate-900 mb-1.5">3Dモデルを表示できませんでした</h2>
      <p id="error-message" class="text-xs text-slate-600 leading-relaxed"></p>
    </div>
  </div>

  <!-- Bottom Floating Camera & Interaction Toolbar -->
  <nav aria-label="カメラ・カード操作パネル" class="fixed bottom-3 sm:bottom-5 left-1/2 -translate-x-1/2 z-10 w-[calc(100vw-1rem)] max-w-4xl flex justify-center pointer-events-none">
    <div class="gallery-glass rounded-2xl sm:rounded-full p-1.5 sm:px-2.5 sm:py-2 flex flex-wrap items-center justify-center gap-1 sm:gap-1.5 pointer-events-auto">
      <button type="button" data-preset="front" class="cam-btn active px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        正面
      </button>
      <button type="button" data-preset="angle34" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        斜め
      </button>
      <button type="button" data-preset="side" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        横から
      </button>
      <button type="button" data-preset="cardBack" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        カード裏面
      </button>
      <button type="button" data-preset="back" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        封筒裏面
      </button>
      <button type="button" data-preset="closeup" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        カード拡大
      </button>

      <span class="hidden sm:inline-block w-px h-5 bg-slate-200 mx-0.5"></span>

      <button type="button" id="toggle-slide-card" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80 flex items-center gap-1.5">
        <span id="slide-dot" class="w-2 h-2 rounded-full bg-slate-300 transition-colors"></span>
        <span>カード出し入れ</span>
      </button>

      <button type="button" id="toggle-autorotate" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80 flex items-center gap-1.5">
        <span id="autorotate-dot" class="w-2 h-2 rounded-full bg-slate-300 transition-colors"></span>
        <span>自動回転</span>
      </button>

      <button type="button" data-preset="reset" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        リセット
      </button>
    </div>
  </nav>

  <!-- Watchdog for module/network/file:// errors -->
  <script>
    window.__viewerLoaded = false;
    setTimeout(function () {
      if (!window.__viewerLoaded) {
        var loader = document.getElementById('loading-overlay');
        var box = document.getElementById('error-box');
        var msg = document.getElementById('error-message');
        if (loader) loader.style.display = 'none';
        if (box && msg) {
          if (location.protocol === 'file:') {
            msg.textContent = 'ローカルファイル(file://)の直接起動では3Dモジュールが制限されます。Live ServerまたはGitHub Pages経由で開いてください。';
          } else {
            msg.textContent = '3Dライブラリの読み込みに時間がかかっています。通信環境をご確認のうえ再読み込みしてください。';
          }
          box.classList.remove('hidden');
        }
      }
    }, 5000);
  </script>

  <!-- Main Three.js Application Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    function hideLoader() {
      window.__viewerLoaded = true;
      const loadingOverlay = document.getElementById('loading-overlay');
      if (loadingOverlay) {
        loadingOverlay.style.opacity = '0';
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 250);
      }
    }

    function showError(text) {
      window.__viewerLoaded = true;
      const loadingOverlay = document.getElementById('loading-overlay');
      if (loadingOverlay) loadingOverlay.style.display = 'none';
      const errorBox = document.getElementById('error-box');
      const errorMsg = document.getElementById('error-message');
      if (errorBox && errorMsg) {
        errorMsg.textContent = text;
        errorBox.classList.remove('hidden');
      }
    }

    function createSeededRandom(seed = 20261122) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function paintHandmadeCottonBase(ctx, width, height, options = {}) {
      const {
        baseColor = '#F4EFE1',
        warmEdgeTint = true,
        topFlapAgingTint = false,
        seed = 104729
      } = options;

      const rand = createSeededRandom(seed);

      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < 45; i++) {
        const cx = rand() * width;
        const cy = rand() * height;
        const radius = (0.08 + rand() * 0.22) * Math.max(width, height);
        const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, radius);
        if (rand() > 0.45) {
          grad.addColorStop(0, 'rgba(232, 222, 198, 0.14)');
          grad.addColorStop(1, 'rgba(232, 222, 198, 0)');
        } else {
          grad.addColorStop(0, 'rgba(255, 252, 245, 0.18)');
          grad.addColorStop(1, 'rgba(255, 252, 245, 0)');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
      }

      if (topFlapAgingTint) {
        const blotchGrad = ctx.createRadialGradient(
          width * 0.56,
          height * 0.22,
          width * 0.01,
          width * 0.56,
          height * 0.22,
          width * 0.13
        );
        blotchGrad.addColorStop(0, 'rgba(221, 208, 178, 0.44)');
        blotchGrad.addColorStop(0.55, 'rgba(228, 217, 190, 0.22)');
        blotchGrad.addColorStop(1, 'rgba(228, 217, 190, 0)');
        ctx.fillStyle = blotchGrad;
        ctx.fillRect(0, 0, width, height);
      }

      if (warmEdgeTint) {
        const edgeGrad = ctx.createRadialGradient(
          width * 0.5,
          height * 0.5,
          width * 0.28,
          width * 0.5,
          height * 0.5,
          width * 0.72
        );
        edgeGrad.addColorStop(0, 'rgba(218, 206, 182, 0)');
        edgeGrad.addColorStop(1, 'rgba(214, 201, 175, 0.22)');
        ctx.fillStyle = edgeGrad;
        ctx.fillRect(0, 0, width, height);
      }

      ctx.lineCap = 'round';
      for (let i = 0; i < 1400; i++) {
        const x1 = rand() * width;
        const y1 = rand() * height;
        const angle = rand() * Math.PI * 2;
        const len = 4 + rand() * 14;
        const x2 = x1 + Math.cos(angle) * len;
        const y2 = y1 + Math.sin(angle) * len;
        const cx = (x1 + x2) * 0.5 + (rand() - 0.5) * 4;
        const cy = (y1 + y2) * 0.5 + (rand() - 0.5) * 4;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(cx, cy, x2, y2);
        const tone = rand();
        if (tone < 0.45) {
          ctx.strokeStyle = 'rgba(255, 253, 248, 0.34)';
        } else if (tone < 0.88) {
          ctx.strokeStyle = 'rgba(214, 202, 178, 0.26)';
        } else {
          ctx.strokeStyle = 'rgba(182, 166, 138, 0.28)';
        }
        ctx.lineWidth = 0.6 + rand() * 0.8;
        ctx.stroke();
      }
    }

    function createCottonPaperSurfaceMaps() {
      const size = 512;
      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = size;
      bumpCanvas.height = size;
      const bCtx = bumpCanvas.getContext('2d');

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = size;
      roughCanvas.height = size;
      const rCtx = roughCanvas.getContext('2d');

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      rCtx.fillStyle = '#D8D8D8';
      rCtx.fillRect(0, 0, size, size);

      const rand = createSeededRandom(55991);

      for (let i = 0; i < 600; i++) {
        const x = rand() * size;
        const y = rand() * size;
        const r = 2 + rand() * 7;
        const g = bCtx.createRadialGradient(x, y, 0.5, x, y, r);
        const bright = rand() > 0.5;
        g.addColorStop(0, bright ? 'rgba(210,210,210,0.22)' : 'rgba(55,55,55,0.22)');
        g.addColorStop(1, 'rgba(128,128,128,0)');
        bCtx.fillStyle = g;
        bCtx.beginPath();
        bCtx.arc(x, y, r, 0, Math.PI * 2);
        bCtx.fill();
      }

      for (let i = 0; i < 1500; i++) {
        const x1 = rand() * size;
        const y1 = rand() * size;
        const angle = rand() * Math.PI * 2;
        const len = 4 + rand() * 12;
        const x2 = x1 + Math.cos(angle) * len;
        const y2 = y1 + Math.sin(angle) * len;
        const cx = (x1 + x2) * 0.5 + (rand() - 0.5) * 3;
        const cy = (y1 + y2) * 0.5 + (rand() - 0.5) * 3;

        bCtx.beginPath();
        bCtx.moveTo(x1, y1);
        bCtx.quadraticCurveTo(cx, cy, x2, y2);
        bCtx.strokeStyle = rand() > 0.4 ? 'rgba(235,235,235,0.34)' : 'rgba(45,45,45,0.28)';
        bCtx.lineWidth = 0.7 + rand() * 0.8;
        bCtx.stroke();

        rCtx.beginPath();
        rCtx.moveTo(x1, y1);
        rCtx.quadraticCurveTo(cx, cy, x2, y2);
        rCtx.strokeStyle = rand() > 0.5 ? 'rgba(245,245,245,0.25)' : 'rgba(195,195,195,0.25)';
        rCtx.lineWidth = 0.9;
        rCtx.stroke();
      }

      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      bumpMap.wrapS = THREE.RepeatWrapping;
      bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(3, 3);
      bumpMap.anisotropy = 8;

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = THREE.RepeatWrapping;
      roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.repeat.set(3, 3);
      roughnessMap.anisotropy = 8;

      return { bumpMap, roughnessMap };
    }

    function strokeCobaltPenPath(ctx, points, lineWidth, rand, closed = false) {
      if (points.length < 2) return;

      const jittered = points.map(([x, y]) => [
        x + (rand() - 0.5) * 0.9,
        y + (rand() - 0.5) * 0.9
      ]);

      ctx.save();
      ctx.strokeStyle = 'rgba(35, 51, 150, 0.20)';
      ctx.lineWidth = lineWidth * 1.32;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(jittered[0][0], jittered[0][1]);
      for (let i = 1; i < jittered.length; i++) {
        ctx.lineTo(jittered[i][0], jittered[i][1]);
      }
      if (closed) ctx.closePath();
      ctx.stroke();

      ctx.strokeStyle = '#233396';
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(jittered[0][0], jittered[0][1]);
      for (let i = 1; i < jittered.length; i++) {
        ctx.lineTo(jittered[i][0], jittered[i][1]);
      }
      if (closed) ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    function drawSmileyDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      ctx.fillStyle = '#233396';

      ctx.beginPath();
      ctx.ellipse(-9 * scale, -6.5 * scale, 2.6 * scale, 2.9 * scale, 0.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(9 * scale, -6.5 * scale, 2.6 * scale, 2.8 * scale, -0.1, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(0, -0.5 * scale, 1.8 * scale, 0, Math.PI * 2);
      ctx.fill();

      const arcPts = [];
      const steps = 16;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const angle = 0.18 * Math.PI + t * 0.64 * Math.PI;
        const rx = 12.5 * scale;
        const ry = 10.5 * scale;
        arcPts.push([Math.cos(angle) * rx, -0.5 * scale + Math.sin(angle) * ry]);
      }
      strokeCobaltPenPath(ctx, arcPts, 3.1 * scale, rand, false);

      ctx.restore();
    }

    function drawHeartDoodle(ctx, cx, cy, scale, rotation, rand, doubleHeart = false) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const buildHeartPoints = (s) => {
        const pts = [];
        const steps = 32;
        for (let i = 0; i <= steps; i++) {
          const t = (i / steps) * Math.PI * 2;
          const px = 16 * Math.pow(Math.sin(t), 3);
          const py = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          pts.push([px * 1.28 * s, py * 1.23 * s]);
        }
        return pts;
      };

      strokeCobaltPenPath(ctx, buildHeartPoints(scale), 3.7 * Math.max(0.75, scale), rand, true);

      if (doubleHeart) {
        strokeCobaltPenPath(ctx, buildHeartPoints(scale * 0.56), 2.8 * Math.max(0.75, scale), rand, true);
      }

      ctx.restore();
    }

    function drawStarDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const outerR = 22 * scale;
      const starOrder = [0, 2, 4, 1, 3, 0];
      const starPts = starOrder.map((idx) => {
        const a = -Math.PI / 2 + (idx / 5) * Math.PI * 2;
        const rJitter = outerR * (0.93 + rand() * 0.14);
        return [Math.cos(a) * rJitter, Math.sin(a) * rJitter];
      });
      strokeCobaltPenPath(ctx, starPts, 3.2 * Math.max(0.75, scale), rand, false);

      ctx.restore();
    }

    function drawSparkleDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const rLong = 18 * scale;
      const rMid = 4.25 * scale;
      const pts = [];
      const segsPerArm = 5;
      const corners = [
        [0, -rLong],
        [rMid, -rMid],
        [rLong, 0],
        [rMid, rMid],
        [0, rLong],
        [-rMid, rMid],
        [-rLong, 0],
        [-rMid, -rMid]
      ];

      for (let c = 0; c < corners.length; c++) {
        const [x0, y0] = corners[c];
        const [x1, y1] = corners[(c + 1) % corners.length];
        for (let s = 0; s < segsPerArm; s++) {
          const t = s / segsPerArm;
          pts.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
        }
      }
      strokeCobaltPenPath(ctx, pts, 2.9 * Math.max(0.75, scale), rand, true);

      ctx.fillStyle = '#233396';
      ctx.beginPath();
      ctx.arc(rLong * 0.72, -rLong * 0.68, 1.9 * scale, 0, Math.PI * 2);
      ctx.arc(-rLong * 0.74, rLong * 0.66, 1.6 * scale, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    function drawFlowerDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const petalCount = 5;
      for (let p = 0; p < petalCount; p++) {
        const baseA = (p / petalCount) * Math.PI * 2;
        const petalPts = [];
        const steps = 14;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const localA = (t - 0.5) * 1.12;
          const radial = (6.5 + 16.5 * Math.sin(t * Math.PI)) * scale;
          const a = baseA + localA * 0.55;
          petalPts.push([Math.cos(a) * radial, Math.sin(a) * radial]);
        }
        strokeCobaltPenPath(ctx, petalPts, 3.1 * Math.max(0.75, scale), rand, false);
      }

      const centerPts = [];
      for (let i = 0; i <= 16; i++) {
        const a = (i / 16) * Math.PI * 2;
        centerPts.push([Math.cos(a) * 5.5 * scale, Math.sin(a) * 5.5 * scale]);
      }
      strokeCobaltPenPath(ctx, centerPts, 2.9 * Math.max(0.75, scale), rand, true);

      ctx.restore();
    }

    function drawCrownDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const crownPts = [
        [-23 * scale, 13 * scale],
        [-27 * scale, -9 * scale],
        [-11 * scale, 3 * scale],
        [0, -15 * scale],
        [11 * scale, 3 * scale],
        [27 * scale, -9 * scale],
        [23 * scale, 13 * scale],
        [-23 * scale, 13 * scale]
      ];
      strokeCobaltPenPath(ctx, crownPts, 3.4 * Math.max(0.75, scale), rand, true);

      strokeCobaltPenPath(
        ctx,
        [
          [-21.5 * scale, 7.5 * scale],
          [21.5 * scale, 7.5 * scale]
        ],
        2.6 * Math.max(0.75, scale),
        rand,
        false
      );

      ctx.fillStyle = '#233396';
      const tips = [
        [-28 * scale, -13.5 * scale],
        [0, -20 * scale],
        [28 * scale, -13.5 * scale]
      ];
      for (const [tx, ty] of tips) {
        ctx.beginPath();
        ctx.arc(tx, ty, 2.2 * scale, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function drawShootingStarDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      drawStarDoodle(ctx, 14 * scale, -3 * scale, scale * 0.78, 0.2, rand);

      const tail1 = [];
      const tail2 = [];
      for (let i = 0; i <= 12; i++) {
        const t = i / 12;
        const x = (3 - t * 38) * scale;
        const y1 = (-2 + Math.pow(t, 1.4) * 13) * scale;
        const y2 = (5 + Math.pow(t, 1.4) * 14) * scale;
        tail1.push([x, y1]);
        tail2.push([x + 4 * scale, y2]);
      }
      strokeCobaltPenPath(ctx, tail1, 2.8 * Math.max(0.75, scale), rand, false);
      strokeCobaltPenPath(ctx, tail2, 2.5 * Math.max(0.75, scale), rand, false);

      ctx.restore();
    }

    function createEnvelopeBodyAndTopFlapTexture(W, H, flapPeakH) {
      const size = 1024;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      paintHandmadeCottonBase(ctx, size, size, {
        baseColor: '#F4EFE1',
        warmEdgeTint: true,
        topFlapAgingTint: true,
        seed: 18473
      });

      const foldV = H / (H + flapPeakH);
      const foldCanvasY = (1 - foldV) * size;
