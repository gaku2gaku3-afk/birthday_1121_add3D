<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>メッセージカード 3D ビューア</title>
  <!-- Tailwind CSS for clean studio gallery UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #FFFFFF;
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    /* Refined warm gallery floating glassmorphism */
    .gallery-glass {
      background: rgba(255, 253, 249, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(226, 221, 210, 0.9);
      box-shadow: 0 10px 30px rgba(28, 30, 86, 0.07), 0 1px 3px rgba(28, 30, 86, 0.04);
    }
    .cam-btn {
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cam-btn:hover {
      transform: translateY(-1px);
    }
    .cam-btn:active {
      transform: translateY(0) scale(0.97);
    }
    .cam-btn.active {
      background-color: #233396;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(35, 51, 150, 0.28);
    }
  </style>

  <!-- ES Module Import Map for Three.js v0.170.0 & Official Addons -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Fullscreen 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Top-Left Minimal Gallery Header & Interaction Guide -->
  <header class="fixed top-4 left-4 sm:top-6 sm:left-6 z-10 pointer-events-none max-w-[calc(100vw-2rem)]">
    <div class="gallery-glass rounded-2xl px-4 py-3 sm:px-5 sm:py-3.5 inline-block pointer-events-auto">
      <div class="flex items-center gap-2.5">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#233396] shadow-sm"></span>
        <h1 class="text-sm sm:text-base font-bold tracking-tight text-slate-900">
          メッセージカード 3D ビューア
        </h1>
      </div>
      <p class="mt-1 text-[11px] sm:text-xs text-slate-500 font-medium tracking-wide">
        左ドラッグ：360度回転 <span class="mx-1 text-slate-300">/</span>
        ホイール：拡大縮小 <span class="mx-1 text-slate-300">/</span>
        右ドラッグ：移動
      </p>
    </div>
  </header>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="fixed inset-0 z-30 flex items-center justify-center bg-white transition-opacity duration-500">
    <div class="flex flex-col items-center gap-3">
      <div class="w-9 h-9 border-2 border-indigo-100 border-t-[#233396] rounded-full animate-spin"></div>
      <p class="text-xs font-medium text-slate-600 tracking-wider">コットンペーパー＆手書き文字を生成中...</p>
    </div>
  </div>

  <!-- Error Message Box (Hidden unless WebGL error occurs) -->
  <div id="error-box" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4">
    <div class="bg-white rounded-2xl p-6 max-w-md shadow-xl text-center">
      <h2 class="text-base font-bold text-slate-900 mb-2">3Dビューアの初期化エラー</h2>
      <p id="error-message" class="text-sm text-slate-600"></p>
    </div>
  </div>

  <!-- Bottom Floating Japanese Camera & Interaction Toolbar -->
  <nav aria-label="カメラ・カード操作パネル" class="fixed bottom-4 sm:bottom-6 left-1/2 -translate-x-1/2 z-10 w-[calc(100vw-1rem)] max-w-4xl flex justify-center pointer-events-none">
    <div class="gallery-glass rounded-2xl sm:rounded-full p-1.5 sm:px-2.5 sm:py-2 flex flex-wrap items-center justify-center gap-1 sm:gap-1.5 pointer-events-auto">
      <button type="button" data-preset="front" class="cam-btn active px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        正面
      </button>
      <button type="button" data-preset="angle34" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        斜め
      </button>
      <button type="button" data-preset="side" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        横から
      </button>
      <button type="button" data-preset="cardBack" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        カード裏面
      </button>
      <button type="button" data-preset="back" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        封筒裏面
      </button>
      <button type="button" data-preset="closeup" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        カード拡大
      </button>

      <span class="hidden sm:inline-block w-px h-5 bg-slate-200 mx-0.5"></span>

      <button type="button" id="toggle-slide-card" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80 flex items-center gap-1.5">
        <span id="slide-dot" class="w-2 h-2 rounded-full bg-slate-300 transition-colors"></span>
        <span>カード出し入れ</span>
      </button>

      <button type="button" id="toggle-autorotate" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80 flex items-center gap-1.5">
        <span id="autorotate-dot" class="w-2 h-2 rounded-full bg-slate-300 transition-colors"></span>
        <span>自動回転</span>
      </button>

      <button type="button" data-preset="reset" class="cam-btn px-2.5 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50/80">
        リセット
      </button>
    </div>
  </nav>

  <!-- Main Three.js Application Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    /**
     * ============================================================================
     * 1. DETERMINISTIC SEEDED PRNG (For organic cotton fiber & pen jitter)
     * ============================================================================
     */
    function createSeededRandom(seed = 20261122) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    /**
     * ============================================================================
     * 2. PROCEDURAL COTTON RAG PAPER TEXTURES (COLOR, BUMP, ROUGHNESS, GALLERY BG)
     * ============================================================================
     */

    /**
     * Paints authentic handmade cream cotton-rag paper fibers, subtle warm mottling,
     * and micro-pulp grain onto a 2D canvas context.
     */
    function paintHandmadeCottonBase(ctx, width, height, options = {}) {
      const {
        baseColor = '#F4EFE1',
        warmEdgeTint = true,
        topFlapAgingTint = false,
        seed = 104729
      } = options;

      const rand = createSeededRandom(seed);

      // Base warm ivory-cream fill
      ctx.fillStyle = baseColor;
      ctx.fillRect(0, 0, width, height);

      // Subtle organic pulp cloudiness across sheet
      for (let i = 0; i < 95; i++) {
        const cx = rand() * width;
        const cy = rand() * height;
        const radius = (0.08 + rand() * 0.22) * Math.max(width, height);
        const grad = ctx.createRadialGradient(cx, cy, 4, cx, cy, radius);
        if (rand() > 0.45) {
          grad.addColorStop(0, 'rgba(232, 222, 198, 0.14)');
          grad.addColorStop(1, 'rgba(232, 222, 198, 0)');
        } else {
          grad.addColorStop(0, 'rgba(255, 252, 245, 0.18)');
          grad.addColorStop(1, 'rgba(255, 252, 245, 0)');
        }
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, width, height);
      }

      // Delicate warm cream/beige handmade aging tint near upper-right apex of top flap (matching message.jpg)
      if (topFlapAgingTint) {
        const blotchGrad = ctx.createRadialGradient(
          width * 0.56,
          height * 0.22,
          width * 0.01,
          width * 0.56,
          height * 0.22,
          width * 0.13
        );
        blotchGrad.addColorStop(0, 'rgba(221, 208, 178, 0.44)');
        blotchGrad.addColorStop(0.55, 'rgba(228, 217, 190, 0.22)');
        blotchGrad.addColorStop(1, 'rgba(228, 217, 190, 0)');
        ctx.fillStyle = blotchGrad;
        ctx.fillRect(0, 0, width, height);
      }

      // Soft warm perimeter shading
      if (warmEdgeTint) {
        const edgeGrad = ctx.createRadialGradient(
          width * 0.5,
          height * 0.5,
          width * 0.28,
          width * 0.5,
          height * 0.5,
          width * 0.72
        );
        edgeGrad.addColorStop(0, 'rgba(218, 206, 182, 0)');
        edgeGrad.addColorStop(1, 'rgba(214, 201, 175, 0.22)');
        ctx.fillStyle = edgeGrad;
        ctx.fillRect(0, 0, width, height);
      }

      // Fine interlaced cotton fibers & tiny organic flecks
      ctx.lineCap = 'round';
      for (let i = 0; i < 4200; i++) {
        const x1 = rand() * width;
        const y1 = rand() * height;
        const angle = rand() * Math.PI * 2;
        const len = 6 + rand() * 24;
        const x2 = x1 + Math.cos(angle) * len;
        const y2 = y1 + Math.sin(angle) * len;
        const cx = (x1 + x2) * 0.5 + (rand() - 0.5) * 6;
        const cy = (y1 + y2) * 0.5 + (rand() - 0.5) * 6;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.quadraticCurveTo(cx, cy, x2, y2);
        const tone = rand();
        if (tone < 0.45) {
          ctx.strokeStyle = 'rgba(255, 253, 248, 0.34)';
        } else if (tone < 0.88) {
          ctx.strokeStyle = 'rgba(214, 202, 178, 0.26)';
        } else {
          // Occasional natural unbleached cotton speck
          ctx.strokeStyle = 'rgba(182, 166, 138, 0.28)';
        }
        ctx.lineWidth = 0.7 + rand() * 1.1;
        ctx.stroke();
      }
    }

    /**
     * Generates tactile cotton-paper bumpMap and roughnessMap (1024x1024, anisotropy = 16).
     */
    function createCottonPaperSurfaceMaps() {
      const size = 1024;
      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = size;
      bumpCanvas.height = size;
      const bCtx = bumpCanvas.getContext('2d');

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = size;
      roughCanvas.height = size;
      const rCtx = roughCanvas.getContext('2d');

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      rCtx.fillStyle = '#D8D8D8'; // Matte cotton paper (~0.85 roughness)
      rCtx.fillRect(0, 0, size, size);

      const rand = createSeededRandom(55991);

      // Soft paper dimples / felt press texture
      for (let i = 0; i < 1600; i++) {
        const x = rand() * size;
        const y = rand() * size;
        const r = 3 + rand() * 11;
        const g = bCtx.createRadialGradient(x, y, 0.5, x, y, r);
        const bright = rand() > 0.5;
        g.addColorStop(0, bright ? 'rgba(210,210,210,0.22)' : 'rgba(55,55,55,0.22)');
        g.addColorStop(1, 'rgba(128,128,128,0)');
        bCtx.fillStyle = g;
        bCtx.beginPath();
        bCtx.arc(x, y, r, 0, Math.PI * 2);
        bCtx.fill();
      }

      // Crisp raised cotton fibers
      for (let i = 0; i < 4500; i++) {
        const x1 = rand() * size;
        const y1 = rand() * size;
        const angle = rand() * Math.PI * 2;
        const len = 5 + rand() * 18;
        const x2 = x1 + Math.cos(angle) * len;
        const y2 = y1 + Math.sin(angle) * len;
        const cx = (x1 + x2) * 0.5 + (rand() - 0.5) * 4;
        const cy = (y1 + y2) * 0.5 + (rand() - 0.5) * 4;

        bCtx.beginPath();
        bCtx.moveTo(x1, y1);
        bCtx.quadraticCurveTo(cx, cy, x2, y2);
        bCtx.strokeStyle = rand() > 0.4 ? 'rgba(235,235,235,0.34)' : 'rgba(45,45,45,0.28)';
        bCtx.lineWidth = 0.8 + rand() * 1.0;
        bCtx.stroke();

        rCtx.beginPath();
        rCtx.moveTo(x1, y1);
        rCtx.quadraticCurveTo(cx, cy, x2, y2);
        rCtx.strokeStyle = rand() > 0.5 ? 'rgba(245,245,245,0.25)' : 'rgba(195,195,195,0.25)';
        rCtx.lineWidth = 1.0;
        rCtx.stroke();
      }

      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      bumpMap.wrapS = THREE.RepeatWrapping;
      bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(2, 2);
      bumpMap.anisotropy = 16;

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.wrapS = THREE.RepeatWrapping;
      roughnessMap.wrapT = THREE.RepeatWrapping;
      roughnessMap.repeat.set(2, 2);
      roughnessMap.anisotropy = 16;

      return { bumpMap, roughnessMap };
    }

    /**
     * ============================================================================
     * 3. HIGH-RESOLUTION (2048x2048) ENVELOPE FLAP DOODLES & HANDWRITTEN CARD TEXTURES
     * ============================================================================
     */

    /**
     * Helper to stroke an organic cobalt-blue felt-tip pen path with natural hand tremor
     * and subtle cotton-paper ink absorption.
     */
    function strokeCobaltPenPath(ctx, points, lineWidth, rand, closed = false) {
      if (points.length < 2) return;

      const jittered = points.map(([x, y]) => [
        x + (rand() - 0.5) * 1.4,
        y + (rand() - 0.5) * 1.4
      ]);

      // Pass 1: Soft subtle ink bleed halo into cotton paper fibers
      ctx.save();
      ctx.strokeStyle = 'rgba(35, 51, 150, 0.20)';
      ctx.lineWidth = lineWidth * 1.32;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.beginPath();
      ctx.moveTo(jittered[0][0], jittered[0][1]);
      for (let i = 1; i < jittered.length; i++) {
        ctx.lineTo(jittered[i][0], jittered[i][1]);
      }
      if (closed) ctx.closePath();
      ctx.stroke();

      // Pass 2: Rich saturated cobalt/royal blue (#233396) core ink stroke
      ctx.strokeStyle = '#233396';
      ctx.lineWidth = lineWidth;
      ctx.beginPath();
      ctx.moveTo(jittered[0][0], jittered[0][1]);
      for (let i = 1; i < jittered.length; i++) {
        ctx.lineTo(jittered[i][0], jittered[i][1]);
      }
      if (closed) ctx.closePath();
      ctx.stroke();
      ctx.restore();
    }

    /**
     * Draws one of the cute hand-drawn cobalt blue smiley faces (`:)`) with two eye dots,
     * center nose dot, and curved smile arc.
     */
    function drawSmileyDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const inkColor = '#233396';
      ctx.fillStyle = inkColor;

      // Left eye dot
      ctx.beginPath();
      ctx.ellipse(-18 * scale, -13 * scale, 5.2 * scale, 5.8 * scale, 0.1, 0, Math.PI * 2);
      ctx.fill();

      // Right eye dot
      ctx.beginPath();
      ctx.ellipse(18 * scale, -13 * scale, 5.2 * scale, 5.6 * scale, -0.1, 0, Math.PI * 2);
      ctx.fill();

      // Center nose dot (characteristic detail in message.jpg!)
      ctx.beginPath();
      ctx.arc(0, -1 * scale, 3.6 * scale, 0, Math.PI * 2);
      ctx.fill();

      // Curved happy smile arc
      const arcPts = [];
      const steps = 16;
      for (let i = 0; i <= steps; i++) {
        const t = i / steps;
        const angle = 0.18 * Math.PI + t * 0.64 * Math.PI;
        const rx = 25 * scale;
        const ry = 21 * scale;
        arcPts.push([Math.cos(angle) * rx, -1 * scale + Math.sin(angle) * ry]);
      }
      strokeCobaltPenPath(ctx, arcPts, 6.2 * scale, rand, false);

      ctx.restore();
    }

    /**
     * Draws a hand-penned cobalt-blue heart (single or double nested) at (cx, cy).
     */
    function drawHeartDoodle(ctx, cx, cy, scale, rotation, rand, doubleHeart = false) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const buildHeartPoints = (s) => {
        const pts = [];
        const steps = 34;
        for (let i = 0; i <= steps; i++) {
          const t = (i / steps) * Math.PI * 2;
          const px = 16 * Math.pow(Math.sin(t), 3);
          const py = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
          pts.push([px * 2.55 * s, py * 2.45 * s]);
        }
        return pts;
      };

      strokeCobaltPenPath(ctx, buildHeartPoints(scale), 7.4 * Math.max(0.75, scale), rand, true);

      if (doubleHeart) {
        strokeCobaltPenPath(ctx, buildHeartPoints(scale * 0.56), 5.6 * Math.max(0.75, scale), rand, true);
      }

      ctx.restore();
    }

    /**
     * Draws a hand-sketched 5-pointed star outline at (cx, cy).
     */
    function drawStarDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const outerR = 44 * scale;
      const starOrder = [0, 2, 4, 1, 3, 0];
      const starPts = starOrder.map((idx) => {
        const a = -Math.PI / 2 + (idx / 5) * Math.PI * 2;
        const rJitter = outerR * (0.93 + rand() * 0.14);
        return [Math.cos(a) * rJitter, Math.sin(a) * rJitter];
      });
      strokeCobaltPenPath(ctx, starPts, 6.4 * Math.max(0.75, scale), rand, false);

      ctx.restore();
    }

    /**
     * Draws a 4-point hand-drawn sparkle / twinkle star (`✦`) with subtle surrounding dots.
     */
    function drawSparkleDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const rLong = 36 * scale;
      const rMid = 8.5 * scale;
      const pts = [];
      const segsPerArm = 6;
      const corners = [
        [0, -rLong],
        [rMid, -rMid],
        [rLong, 0],
        [rMid, rMid],
        [0, rLong],
        [-rMid, rMid],
        [-rLong, 0],
        [-rMid, -rMid]
      ];

      for (let c = 0; c < corners.length; c++) {
        const [x0, y0] = corners[c];
        const [x1, y1] = corners[(c + 1) % corners.length];
        for (let s = 0; s < segsPerArm; s++) {
          const t = s / segsPerArm;
          pts.push([x0 + (x1 - x0) * t, y0 + (y1 - y0) * t]);
        }
      }
      strokeCobaltPenPath(ctx, pts, 5.8 * Math.max(0.75, scale), rand, true);

      // Tiny companion ink dots
      ctx.fillStyle = '#233396';
      ctx.beginPath();
      ctx.arc(rLong * 0.72, -rLong * 0.68, 3.8 * scale, 0, Math.PI * 2);
      ctx.arc(-rLong * 0.74, rLong * 0.66, 3.2 * scale, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
    }

    /**
     * Draws a 5-petal hand-drawn flower outline matching the envelope's floral doodle.
     */
    function drawFlowerDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const petalCount = 5;
      for (let p = 0; p < petalCount; p++) {
        const baseA = (p / petalCount) * Math.PI * 2;
        const petalPts = [];
        const steps = 16;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const localA = (t - 0.5) * 1.12;
          const radial = (13 + 33 * Math.sin(t * Math.PI)) * scale;
          const a = baseA + localA * 0.55;
          petalPts.push([Math.cos(a) * radial, Math.sin(a) * radial]);
        }
        strokeCobaltPenPath(ctx, petalPts, 6.2 * Math.max(0.75, scale), rand, false);
      }

      const centerPts = [];
      for (let i = 0; i <= 18; i++) {
        const a = (i / 18) * Math.PI * 2;
        centerPts.push([Math.cos(a) * 11 * scale, Math.sin(a) * 11 * scale]);
      }
      strokeCobaltPenPath(ctx, centerPts, 5.8 * Math.max(0.75, scale), rand, true);

      ctx.restore();
    }

    /**
     * Draws a cute hand-sketched 3-point birthday crown with tiny pearl dots on its tips.
     */
    function drawCrownDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      const crownPts = [
        [-46 * scale, 26 * scale],
        [-54 * scale, -18 * scale],
        [-22 * scale, 6 * scale],
        [0, -30 * scale],
        [22 * scale, 6 * scale],
        [54 * scale, -18 * scale],
        [46 * scale, 26 * scale],
        [-46 * scale, 26 * scale]
      ];
      strokeCobaltPenPath(ctx, crownPts, 6.8 * Math.max(0.75, scale), rand, true);

      // Base band line
      strokeCobaltPenPath(
        ctx,
        [
          [-43 * scale, 15 * scale],
          [43 * scale, 15 * scale]
        ],

    /**
     * Draws a shooting star with trailing curved motion lines.
     */
    function drawShootingStarDoodle(ctx, cx, cy, scale, rotation, rand) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      // Star head on the right
      drawStarDoodle(ctx, 28 * scale, -6 * scale, scale * 0.78, 0.2, rand);

      // Two curved trailing tail arcs
      const tail1 = [];
      const tail2 = [];
      for (let i = 0; i <= 14; i++) {
        const t = i / 14;
        const x = (6 - t * 76) * scale;
        const y1 = (-4 + Math.pow(t, 1.4) * 26) * scale;
        const y2 = (10 + Math.pow(t, 1.4) * 28) * scale;
        tail1.push([x, y1]);
        tail2.push([x + 8 * scale, y2]);
      }
      strokeCobaltPenPath(ctx, tail1, 5.6 * Math.max(0.75, scale), rand, false);
      strokeCobaltPenPath(ctx, tail2, 5.0 * Math.max(0.75, scale), rand, false);

      ctx.restore();
    }

    /**
     * Generates the 2048x2048 texture for the envelope back body & open triangular top flap,
     * including handmade cotton grain, subtle warm aging tint on the flap apex, and crease lines.
     */
    function createEnvelopeBodyAndTopFlapTexture(W, H, flapPeakH) {
      const size = 2048;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      paintHandmadeCottonBase(ctx, size, size, {
        baseColor: '#F4EFE1',
        warmEdgeTint: true,
        topFlapAgingTint: true,
        seed: 18473
      });

      // Subtle folded crease lines along the triangular top flap edges
      const foldV = H / (H + flapPeakH);
      const foldCanvasY = (1 - foldV) * size;

      ctx.save();
      ctx.strokeStyle = 'rgba(196, 183, 156, 0.42)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, foldCanvasY);
      ctx.lineTo(size, foldCanvasY);
      ctx.stroke();

      // Subtle diagonal fold bevel shading on the open top flap
      const leftDiagonalGrad = ctx.createLinearGradient(0, foldCanvasY, size * 0.25, foldCanvasY - size * 0.25);
      leftDiagonalGrad.addColorStop(0, 'rgba(205, 192, 165, 0.22)');
      leftDiagonalGrad.addColorStop(1, 'rgba(205, 192, 165, 0)');
      ctx.fillStyle = leftDiagonalGrad;
      ctx.fillRect(0, 0, size, foldCanvasY);
      ctx.restore();

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 16;
      return tex;
    }

    /**
     * Generates the 2048x2048 front flaps texture with all 6 signature hand-drawn
     * cobalt-blue (#233396) pen doodles (2 smileys, 5-petal flower, star, sun sparkle, heart).
     */
    function createEnvelopeFrontFlapTexture() {
      const size = 2048;
      const canvas = document.createElement('canvas');
      canvas.width = size;
      canvas.height = size;
      const ctx = canvas.getContext('2d');

      paintHandmadeCottonBase(ctx, size, size, {
        baseColor: '#F4EFE1',
        warmEdgeTint: true,
        seed: 31907
      });

      const rand = createSeededRandom(88421);

      // Subtle paper fold crease shading along the diagonal bottom & side flap seams
      ctx.save();
      ctx.strokeStyle = 'rgba(192, 179, 152, 0.35)';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(0, size);
      ctx.lineTo(size * 0.26, size * 0.46);
      ctx.lineTo(size * 0.74, size * 0.46);
      ctx.lineTo(size, size);
      ctx.stroke();
      ctx.restore();

      // ------------------------------------------------------------------------
      // 1. Upper-left flap smiley face: (u = 0.175, v = 0.365)
      // ------------------------------------------------------------------------
      drawSmileyDoodle(ctx, 0.175 * size, (1 - 0.365) * size, 1.04, 0.05, rand);

      // ------------------------------------------------------------------------
      // 2. Bottom-left 5-petal flower outline: (u = 0.215, v = 0.175)
      // ------------------------------------------------------------------------
      drawFlowerDoodle(ctx, 0.215 * size, (1 - 0.175) * size, 1.0, -0.12, rand);

      // ------------------------------------------------------------------------
      // 3. Upper-center sketched 5-pointed star: (u = 0.445, v = 0.405)
      // ------------------------------------------------------------------------
      drawStarDoodle(ctx, 0.445 * size, (1 - 0.405) * size, 0.96, -0.14, rand);

      // ------------------------------------------------------------------------
      // 4. Lower-right-center small circle sun / sparkle: (u = 0.625, v = 0.225)
      // ------------------------------------------------------------------------
      {
        const sunX = 0.625 * size;
        const sunY = (1 - 0.225) * size;
        ctx.save();
        ctx.translate(sunX, sunY);

        // Central small circle
        const sunCircle = [];
        for (let i = 0; i <= 20; i++) {
          const a = (i / 20) * Math.PI * 2;
          sunCircle.push([Math.cos(a) * 16.5, Math.sin(a) * 16.5]);
        }
        strokeCobaltPenPath(ctx, sunCircle, 5.8, rand, true);

        // 8 alternating radial rays and dots around the circle
        const rayCount = 8;
        for (let r = 0; r < rayCount; r++) {
          const a = (r / rayCount) * Math.PI * 2 + 0.12;
          if (r % 2 === 0) {
            strokeCobaltPenPath(
              ctx,
              [
                [Math.cos(a) * 26, Math.sin(a) * 26],
                [Math.cos(a) * 37, Math.sin(a) * 37]
              ],
              5.6,
              rand,
              false
            );
          } else {
            ctx.fillStyle = '#233396';
            ctx.beginPath();
            ctx.arc(Math.cos(a) * 30, Math.sin(a) * 30, 3.8, 0, Math.PI * 2);
            ctx.fill();
          }
        }
        ctx.restore();
      }

      // ------------------------------------------------------------------------
      // 5. Bottom-right corner smiley face: (u = 0.845, v = 0.145)
      // ------------------------------------------------------------------------
      drawSmileyDoodle(ctx, 0.845 * size, (1 - 0.145) * size, 1.0, -0.04, rand);

      // ------------------------------------------------------------------------
      // 6. Middle-right side flap thick hand-drawn heart outline: (u = 0.88, v = 0.45)
      // ------------------------------------------------------------------------
      drawHeartDoodle(ctx, 0.88 * size, (1 - 0.45) * size, 1.0, 0.08, rand, false);

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = 16;
      return tex;
    }

    };

    /**
     * Renders a line of organic hand-written cobalt-blue (#233396) text onto the card canvas,
     * supporting uppercase, lowercase, digits, apostrophes, and crisp felt-tip periods.
     */
    function drawHandwrittenLine(ctx, text, options, rand) {
      let {
        centerX = null,
        leftX = null,
        y = 400,
        charHeight = 68,
        baseCharWidth = 48,
        letterSpacing = 18,
        strokeWidth = 10.5,
        maxWidth = null
      } = options;

      const chars = Array.from(text);
      let widths = chars.map((ch) => baseCharWidth * (GLYPH_WIDTH_FACTOR[ch] ?? 0.80));
      let totalWidth = widths.reduce((sum, w) => sum + w, 0) + letterSpacing * Math.max(0, chars.length - 1);

      // Auto-fit safety scale so long lines always preserve generous left/right card margins
      if (maxWidth !== null && totalWidth > maxWidth) {
        const fitScale = maxWidth / totalWidth;
        baseCharWidth *= fitScale;
        letterSpacing *= fitScale;
        widths = widths.map((w) => w * fitScale);
        totalWidth *= fitScale;
      }

      let cursorX = leftX !== null ? leftX : centerX - totalWidth * 0.5;
      const startX = cursorX;

      for (let i = 0; i < chars.length; i++) {
        const ch = chars[i];
        const gw = widths[i];
        const strokes = HAND_GLYPHS[ch];

        // Subtle natural hand-written baseline & tilt drift per letter
        const baselineJitter = (rand() - 0.5) * 4.2;
        const tilt = (rand() - 0.5) * 0.045;

        if (ch === '.') {
          // Crisp felt-tip period dot with subtle ink absorption halo
          const dotX = cursorX + gw * 0.52;
          const dotY = y + charHeight * 0.91 + baselineJitter * 0.5;
          const dotR = strokeWidth * 0.64;
          ctx.save();
          ctx.fillStyle = 'rgba(35, 51, 150, 0.22)';
          ctx.beginPath();
          ctx.arc(dotX, dotY, dotR * 1.32, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#233396';
          ctx.beginPath();
          ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else if (ch === '!') {
          // Hand-penned cobalt-blue exclamation mark (tapered vertical stroke + ink dot)
          ctx.save();
          ctx.translate(cursorX + gw * 0.5, y + charHeight * 0.5 + baselineJitter);
          ctx.rotate(tilt);
          ctx.translate(-gw * 0.5, -charHeight * 0.5);

          strokeCobaltPenPath(
            ctx,
            [
              [gw * 0.52, charHeight * 0.06],
              [gw * 0.50, charHeight * 0.42],
              [gw * 0.49, charHeight * 0.68]
            ],
            strokeWidth,
            rand,
            false
          );

          const dotX = gw * 0.49 + (rand() - 0.5) * 1.2;
          const dotY = charHeight * 0.90 + (rand() - 0.5) * 1.2;
          const dotR = strokeWidth * 0.64;
          ctx.fillStyle = 'rgba(35, 51, 150, 0.22)';
          ctx.beginPath();
          ctx.arc(dotX, dotY, dotR * 1.32, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#233396';
          ctx.beginPath();
          ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        } else if (strokes) {
          ctx.save();
          ctx.translate(cursorX + gw * 0.5, y + charHeight * 0.5 + baselineJitter);
          ctx.rotate(tilt);
          ctx.translate(-gw * 0.5, -charHeight * 0.5);

          for (const stroke of strokes) {
            const pts = stroke.map(([nx, ny]) => [nx * gw, ny * charHeight]);
            strokeCobaltPenPath(ctx, pts, strokeWidth, rand, false);
          }

          // Crisp felt-tip tittle dot above lowercase 'i'
          if (ch === 'i') {
            const dotX = gw * 0.50 + (rand() - 0.5) * 1.5;
            const dotY = charHeight * 0.16 + (rand() - 0.5) * 1.5;
            const dotR = strokeWidth * 0.60;
            ctx.fillStyle = 'rgba(35, 51, 150, 0.22)';
            ctx.beginPath();
            ctx.arc(dotX, dotY, dotR * 1.32, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#233396';
            ctx.beginPath();
            ctx.arc(dotX, dotY, dotR, 0, Math.PI * 2);
            ctx.fill();
          }

          ctx.restore();
        }

        cursorX += gw + letterSpacing;
      }

      return { startX, endX: cursorX - letterSpacing, totalWidth };
    }

    /**

    /**

    /**
     * ============================================================================
     * 5. SOLID 3D DECKLED PAPER SLAB BUILDER (100% OPAQUE, ZERO Z-FIGHTING)
     * ============================================================================
     */

    /**
     * Subdivides a closed 2D polygon perimeter and adds subtle organic handmade deckled edge
     * displacement along designated deckled segments.
     */
    function buildDeckledContour(rawEdges, seed = 101) {
      const rand = createSeededRandom(seed);
      const pts = [];

      for (const edge of rawEdges) {
        const { from, to, segments = 16, deckleAmp = 0.0 } = edge;
        const dx = to[0] - from[0];
        const dy = to[1] - from[1];
        const len = Math.hypot(dx, dy) || 1;
        // Outward perpendicular normal (assuming counter-clockwise contour)
        const nx = dy / len;
        const ny = -dx / len;

        for (let s = 0; s < segments; s++) {
          const t = s / segments;
          let x = from[0] + dx * t;
          let y = from[1] + dy * t;

          if (deckleAmp > 0) {
            // Smooth multi-frequency deckled cotton edge tapered to 0 at corners
            const cornerTaper = Math.sin(t * Math.PI);
            const wave =
              0.55 * Math.sin(t * Math.PI * 11.0 + rand() * 1.5) +
              0.30 * Math.sin(t * Math.PI * 23.0 + rand() * 2.0) +
              0.15 * (rand() - 0.5);
            const disp = deckleAmp * cornerTaper * wave;
            x += nx * disp;
            y += ny * disp;
          }
          pts.push(new THREE.Vector2(x, y));
        }
      }

      return pts;
    }

    /**
     * Constructs a closed, solid 3D paper slab BufferGeometry from a counter-clockwise
     * 2D polygon contour with real physical paper thickness (`thickness`), organic 3D surface
     * curvature (`zCurveFn`), and custom UV mapping (`uvFn`).
     * Guarantees 100% outward-facing triangle normals on front face, back face, and side walls.
     */
    function buildSolidPaperSlab({
      contour2D,
      thickness = 0.018,
      zBase = 0.0,
      zCurveFn = () => 0,
      uvFn = (x, y) => [x, y],
      backUvFn = null,
      bevelRatio = 0.25
    }) {
      const n = contour2D.length;
      const triangles = THREE.ShapeUtils.triangulateShape(contour2D, []);

      const positions = [];
      const uvs = [];
      const indices = [];

      // Ring 0: Front face vertices (0 .. n-1)
      for (let i = 0; i < n; i++) {
        const p = contour2D[i];
        const zFront = zBase + thickness * 0.5 + zCurveFn(p.x, p.y);
        positions.push(p.x, p.y, zFront);
        const [u, v] = uvFn(p.x, p.y);
        uvs.push(u, v);
      }

      // Ring 1: Back face vertices (n .. 2n-1)
      for (let i = 0; i < n; i++) {
        const p = contour2D[i];
        const zBack = zBase - thickness * 0.5 + zCurveFn(p.x, p.y);
        positions.push(p.x, p.y, zBack);
        const [u, v] = backUvFn ? backUvFn(p.x, p.y) : uvFn(p.x, p.y);
        uvs.push(u, v);
      }

      // Front face triangles (counter-clockwise -> +Z outward normal)
      for (const [a, b, c] of triangles) {
        indices.push(a, b, c);
      }

      // Back face triangles (reversed winding -> -Z outward normal)
      for (const [a, b, c] of triangles) {
        indices.push(n + a, n + c, n + b);
      }

      // Solid perimeter edge walls connecting Front Ring (0..n-1) and Back Ring (n..2n-1)
      // For a counter-clockwise 2D contour, edge i -> next has outward normal (dy, -dx, 0),
      // so quad (f0, b0, b1, f1) with triangles (f0, b0, b1) and (f0, b1, f1) faces strictly outward!
      for (let i = 0; i < n; i++) {
        const next = (i + 1) % n;
        const f0 = i;
        const f1 = next;
        const b0 = n + i;
        const b1 = n + next;

        indices.push(f0, b0, b1);
        indices.push(f0, b1, f1);
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    /**
     * ============================================================================
     * 6. COMPLETE 3D OPEN ENVELOPE & MESSAGE CARD ASSEMBLY
     * ============================================================================
     */
    function buildEnvelopeAndCardAssembly() {
      const rootGroup = new THREE.Group();

      // Exact geometric dimensions matching specifications
      const W = 3.20;
      const H = 2.32;
      const halfW = W * 0.5; // 1.60
      const halfH = H * 0.5; // 1.16
      const flapPeakH = 1.38;
      const flapApexX = -0.02;
      const flapApexY = halfH + flapPeakH; // 2.54
      const paperThickness = 0.018;

      // Generate procedural textures & surface maps
      const paperSurfaceMaps = createCottonPaperSurfaceMaps();
      const bodyTopFlapTex = createEnvelopeBodyAndTopFlapTexture(W, H, flapPeakH);
      const frontFlapsTex = createEnvelopeFrontFlapTexture();
      const cardFrontTex = createMessageCardTexture();
      const cardBackTex = createDecoratedCardBackTexture();
      const cardEdgeTex = createPlainCottonEdgeTexture();
      // ------------------------------------------------------------------------
      // OPAQUE TACTILE PAPER MATERIALS (transparent: false, opacity: 1.0, depthWrite: true)
      // ------------------------------------------------------------------------
      const bodyAndTopFlapMat = new THREE.MeshStandardMaterial({
        map: bodyTopFlapTex,
        bumpMap: paperSurfaceMaps.bumpMap,
        bumpScale: 0.0042,
        roughnessMap: paperSurfaceMaps.roughnessMap,
        roughness: 0.88,
        metalness: 0.0,
        transparent: false,
        opacity: 1.0,
        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide
      });

      const frontFlapsMat = new THREE.MeshStandardMaterial({
        map: frontFlapsTex,
        bumpMap: paperSurfaceMaps.bumpMap,
        bumpScale: 0.0042,
        roughnessMap: paperSurfaceMaps.roughnessMap,
        roughness: 0.88,
        metalness: 0.0,
        transparent: false,
        opacity: 1.0,
        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide
      });

      // Deep Royal Navy / Indigo Interior Lining (#1C1E56)
      const navyLiningMat = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0x1c1e56),
        bumpMap: paperSurfaceMaps.bumpMap,
        bumpScale: 0.0025,
        roughnessMap: paperSurfaceMaps.roughnessMap,
        roughness: 0.90,
        metalness: 0.0,
        transparent: false,
        opacity: 1.0,
        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide
      });

      const cardFrontMat = new THREE.MeshStandardMaterial({
        map: cardFrontTex,
        bumpMap: paperSurfaceMaps.bumpMap,
        bumpScale: 0.0045,
        roughnessMap: paperSurfaceMaps.roughnessMap,
        roughness: 0.86,
        metalness: 0.0,
        transparent: false,
        opacity: 1.0,
        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide
      });

      const cardBackMat = new THREE.MeshStandardMaterial({
        map: cardBackTex,
        bumpMap: paperSurfaceMaps.bumpMap,
        bumpScale: 0.0045,
        roughnessMap: paperSurfaceMaps.roughnessMap,
        roughness: 0.86,
        metalness: 0.0,
        transparent: false,
        opacity: 1.0,
        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide
      });

      const cardEdgeMat = new THREE.MeshStandardMaterial({
        map: cardEdgeTex,
        bumpMap: paperSurfaceMaps.bumpMap,
        bumpScale: 0.0045,
        roughnessMap: paperSurfaceMaps.roughnessMap,
        roughness: 0.86,
        metalness: 0.0,
        transparent: false,
        opacity: 1.0,
        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide
      });

      // ------------------------------------------------------------------------
      // LAYER 1: ENVELOPE BACK WALL & OPEN TRIANGULAR TOP FLAP (z = -0.036)
      // ------------------------------------------------------------------------
      // Softly rounded apex curve for the open triangular top flap
      const apexRadius = 0.045;
      const backContour = buildDeckledContour(
        [
          { from: [-halfW, -halfH], to: [halfW, -halfH], segments: 24, deckleAmp: 0.002 },
          { from: [halfW, -halfH], to: [halfW, halfH], segments: 20, deckleAmp: 0.002 },
          { from: [halfW, halfH], to: [flapApexX + apexRadius, flapApexY - apexRadius * 0.85], segments: 26, deckleAmp: 0.005 },
          { from: [flapApexX + apexRadius, flapApexY - apexRadius * 0.85], to: [flapApexX, flapApexY], segments: 5, deckleAmp: 0.001 },
          { from: [flapApexX, flapApexY], to: [flapApexX - apexRadius, flapApexY - apexRadius * 0.85], segments: 5, deckleAmp: 0.001 },
          { from: [flapApexX - apexRadius, flapApexY - apexRadius * 0.85], to: [-halfW, halfH], segments: 26, deckleAmp: 0.005 },
          { from: [-halfW, halfH], to: [-halfW, -halfH], segments: 20, deckleAmp: 0.002 }
        ],
        1011
      );

      const backSheetGeo = buildSolidPaperSlab({
        contour2D: backContour,
        thickness: paperThickness,
        zBase: -0.036,
        zCurveFn: (x, y) => {
          // Subtle natural rearward relaxation on the open top flap above y = +halfH
          const flapT = Math.max(0, (y - halfH) / flapPeakH);
          const flapLean = -0.048 * Math.pow(flapT, 1.55);
          // Slight gentle horizontal paper bow
          const crossBow = -0.010 * (1.0 - Math.pow(x / halfW, 2));
          return flapLean + crossBow;
        },
        uvFn: (x, y) => {
          const u = (x + halfW) / W;
          const v = (y + halfH) / (H + flapPeakH);
          return [u, v];
        }
      });

      const backSheetMesh = new THREE.Mesh(backSheetGeo, bodyAndTopFlapMat);
      backSheetMesh.castShadow = true;
      backSheetMesh.receiveShadow = true;
      rootGroup.add(backSheetMesh);

      // ------------------------------------------------------------------------
      // LAYER 2: DEEP ROYAL NAVY / INDIGO INTERIOR LINING (#1C1E56, z = -0.021)
      // ------------------------------------------------------------------------
      const linerMarginX = 0.016;
      const linerBottomY = -halfH + 0.018;
      const linerTopY = halfH - 0.006;

      const navyLinerContour = buildDeckledContour(
        [
          { from: [-halfW + linerMarginX, linerBottomY], to: [halfW - linerMarginX, linerBottomY], segments: 12, deckleAmp: 0 },
          { from: [halfW - linerMarginX, linerBottomY], to: [halfW - linerMarginX, linerTopY], segments: 12, deckleAmp: 0 },
          { from: [halfW - linerMarginX, linerTopY], to: [-halfW + linerMarginX, linerTopY], segments: 16, deckleAmp: 0.002 },
          { from: [-halfW + linerMarginX, linerTopY], to: [-halfW + linerMarginX, linerBottomY], segments: 12, deckleAmp: 0 }
        ],
        2022
      );

      const navyLinerGeo = buildSolidPaperSlab({
        contour2D: navyLinerContour,
        thickness: 0.010,
        zBase: -0.021,
        zCurveFn: (x) => -0.009 * (1.0 - Math.pow(x / halfW, 2)),
        uvFn: (x, y) => [(x + halfW) / W, (y + halfH) / H]
      });

      const navyLinerMesh = new THREE.Mesh(navyLinerGeo, navyLiningMat);
      navyLinerMesh.receiveShadow = true;
      rootGroup.add(navyLinerMesh);

      // ------------------------------------------------------------------------
      // LAYER 3: HANDWRITTEN MESSAGE CARD INSIDE POCKET (z = -0.002)
      // ------------------------------------------------------------------------
      const cardW = 0.79 * W; // 2.528
      const cardH = 2.74;
      const cardHalfW = cardW * 0.5;
      // Resting position: lines 1-4 stay visible above front flaps, while lines 5-7 sit cleanly behind the pocket
      const cardRestCenterY = 0.25; // spans y = -1.12 to +1.62

      const cardContour = buildDeckledContour(
        [
          { from: [-cardHalfW, -cardH * 0.5], to: [cardHalfW, -cardH * 0.5], segments: 24, deckleAmp: 0.003 },
          { from: [cardHalfW, -cardH * 0.5], to: [cardHalfW, cardH * 0.5], segments: 28, deckleAmp: 0.0045 },
          { from: [cardHalfW, cardH * 0.5], to: [-cardHalfW, cardH * 0.5], segments: 28, deckleAmp: 0.005 },
          { from: [-cardHalfW, cardH * 0.5], to: [-cardHalfW, -cardH * 0.5], segments: 28, deckleAmp: 0.0045 }
        ],
        3033
      );

      const cardGeo = buildSolidPaperSlab({
        contour2D: cardContour,
        thickness: 0.021,
        zBase: 0.0,
        zCurveFn: (x, y) => {
          // Subtle organic cotton card bow + gentle forward poise at upper edge
          const archX = 0.011 * (1.0 - Math.pow(x / cardHalfW, 2));
          const tiltY = 0.010 * ((y + cardH * 0.5) / cardH);
          return archX + tiltY;
        },
        uvFn: (x, y) => {
          const u = (x + cardHalfW) / cardW;
          const v = (y + cardH * 0.5) / cardH;
          return [u, v];
        },
        backUvFn: (x, y) => {
          const u = 1.0 - (x + cardHalfW) / cardW;
          const v = (y + cardH * 0.5) / cardH;
          return [u, v];
        }
      });

      // Assign 3 distinct material groups:
      // 0: Front face -> cardFrontMat (handwritten birthday message)
      // 1: Back face -> cardBackMat (hand-drawn cobalt-blue stars, hearts & emojis)
      // 2: Deckled side edges -> cardEdgeMat (clean cream cotton paper rim)
      const frontTriCount = (cardContour.length - 2) * 3;
      cardGeo.clearGroups();
      cardGeo.addGroup(0, frontTriCount, 0);
      cardGeo.addGroup(frontTriCount, frontTriCount, 1);
      cardGeo.addGroup(frontTriCount * 2, cardGeo.index.count - frontTriCount * 2, 2);

      const cardMesh = new THREE.Mesh(cardGeo, [cardFrontMat, cardBackMat, cardEdgeMat]);
      cardMesh.position.set(0, cardRestCenterY, -0.002);
      cardMesh.castShadow = true;
      cardMesh.receiveShadow = true;
      rootGroup.add(cardMesh);

      // ------------------------------------------------------------------------
      // LAYER 4: LEFT & RIGHT TRIANGULAR SIDE FLAPS (z = +0.023)
      // ------------------------------------------------------------------------
      const centerApexX = 0.24 * W; // 0.768
      const centerApexY = 0.04 * H; // 0.0928

      // Left Side Flap
      const leftFlapContour = buildDeckledContour(
        [
          { from: [-halfW, -halfH], to: [-centerApexX, centerApexY], segments: 18, deckleAmp: 0.003 },
          { from: [-centerApexX, centerApexY], to: [-halfW, halfH], segments: 18, deckleAmp: 0.004 },
          { from: [-halfW, halfH], to: [-halfW, -halfH], segments: 20, deckleAmp: 0.001 }
        ],
        4044
      );

      const leftFlapGeo = buildSolidPaperSlab({
        contour2D: leftFlapContour,
        thickness: paperThickness,
        zBase: 0.023,
        zCurveFn: (x) => {
          // Folded spine curves smoothly back toward outer edge x = -halfW
          const tIn = Math.max(0, Math.min(1, (x + halfW) / (halfW - centerApexX)));
          return -0.032 * Math.pow(1.0 - tIn, 2.2) + 0.008 * Math.sin(tIn * Math.PI);
        },
        uvFn: (x, y) => [(x + halfW) / W, (y + halfH) / H]
      });

      const leftFlapMesh = new THREE.Mesh(leftFlapGeo, frontFlapsMat);
      leftFlapMesh.castShadow = true;
      leftFlapMesh.receiveShadow = true;
      rootGroup.add(leftFlapMesh);

      // Right Side Flap
      const rightFlapContour = buildDeckledContour(
        [
          { from: [halfW, -halfH], to: [halfW, halfH], segments: 20, deckleAmp: 0.001 },
          { from: [halfW, halfH], to: [centerApexX, centerApexY], segments: 18, deckleAmp: 0.004 },
          { from: [centerApexX, centerApexY], to: [halfW, -halfH], segments: 18, deckleAmp: 0.003 }
        ],
        5055
      );

      const rightFlapGeo = buildSolidPaperSlab({
        contour2D: rightFlapContour,
        thickness: paperThickness,
        zBase: 0.023,
        zCurveFn: (x) => {
          // Folded spine curves smoothly back toward outer edge x = +halfW
          const tIn = Math.max(0, Math.min(1, (halfW - x) / (halfW - centerApexX)));
          return -0.032 * Math.pow(1.0 - tIn, 2.2) + 0.008 * Math.sin(tIn * Math.PI);
        },
        uvFn: (x, y) => [(x + halfW) / W, (y + halfH) / H]
      });

      const rightFlapMesh = new THREE.Mesh(rightFlapGeo, frontFlapsMat);
      rightFlapMesh.castShadow = true;
      rightFlapMesh.receiveShadow = true;
      rootGroup.add(rightFlapMesh);

      // ------------------------------------------------------------------------
      // LAYER 5: BOTTOM FOLDED FLAP OVERLAPPING SIDE FLAPS (z = +0.043)
      // ------------------------------------------------------------------------
      const bottomFlapContour = buildDeckledContour(
        [
          { from: [-halfW, -halfH], to: [halfW, -halfH], segments: 24, deckleAmp: 0.001 },
          { from: [halfW, -halfH], to: [centerApexX, centerApexY], segments: 18, deckleAmp: 0.0035 },
          { from: [centerApexX, centerApexY], to: [-centerApexX, centerApexY], segments: 24, deckleAmp: 0.0055 },
          { from: [-centerApexX, centerApexY], to: [-halfW, -halfH], segments: 18, deckleAmp: 0.0035 }
        ],
        6066
      );

      const bottomFlapGeo = buildSolidPaperSlab({
        contour2D: bottomFlapContour,
        thickness: paperThickness,
        zBase: 0.043,
        zCurveFn: (x, y) => {
          // Bottom folded spine curves cleanly back at y = -halfH, and gently arches over the card
          const tUp = Math.max(0, Math.min(1, (y + halfH) / (centerApexY + halfH)));
          const bottomSpine = -0.045 * Math.pow(1.0 - tUp, 2.5);
          const centerArch = 0.011 * (1.0 - Math.pow(x / halfW, 2));
          return bottomSpine + centerArch;
        },
        uvFn: (x, y) => [(x + halfW) / W, (y + halfH) / H]
      });

      const bottomFlapMesh = new THREE.Mesh(bottomFlapGeo, frontFlapsMat);
      bottomFlapMesh.castShadow = true;
      bottomFlapMesh.receiveShadow = true;
      rootGroup.add(bottomFlapMesh);

      return {
        rootGroup,
        cardMesh,
        cardRestCenterY,
        cardSlideOutCenterY: cardRestCenterY + 1.05,
        bottomY: -halfH
      };
    }

    /**
     * ============================================================================
     * 7. STUDIO GALLERY SCENE, LIGHTING, 360° CONTROLS & UI INTERACTIONS
     * ============================================================================
     */
    function initApp() {
      const container = document.getElementById('canvas-container');

      // Renderer with ACES Filmic tone mapping & soft shadows
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: 'high-performance'
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.02;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      // Scene with clean pure white (#FFFFFF) studio backdrop
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0xffffff);

      // Subtle neutral studio IBL via RoomEnvironment
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const roomEnv = new RoomEnvironment();
      const envRT = pmremGenerator.fromScene(roomEnv, 0.04);
      scene.environment = envRT.texture;
      scene.environmentIntensity = 0.42;
      roomEnv.dispose();

      // Perspective camera
      const camera = new THREE.PerspectiveCamera(
        34,
        window.innerWidth / window.innerHeight,
        0.05,
        100
      );

      // OrbitControls with smooth damping & full 360-degree rotation
      const controls = new OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.rotateSpeed = 0.85;
      controls.zoomSpeed = 0.95;
      controls.panSpeed = 0.8;
      controls.minDistance = 1.6;
      controls.maxDistance = 14.0;
      controls.minPolarAngle = 0.03;
      controls.maxPolarAngle = Math.PI - 0.03;

      // Balanced Studio Lighting to showcase cotton paper grain & layered paper thickness
      const hemiLight = new THREE.HemisphereLight(0xfffdf8, 0xe8e2d5, 0.68);
      hemiLight.position.set(0, 8, 0);
      scene.add(hemiLight);

      // Directional Key Light (front-left-top)
      const keyLight = new THREE.DirectionalLight(0xfffcf5, 1.45);
      keyLight.position.set(-2.6, 4.8, 5.4);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.camera.near = 1.0;
      keyLight.shadow.camera.far = 16.0;
      const d = 3.2;
      keyLight.shadow.camera.left = -d;
      keyLight.shadow.camera.right = d;
      keyLight.shadow.camera.top = d;
      keyLight.shadow.camera.bottom = -d;
      keyLight.shadow.bias = -0.0003;
      keyLight.shadow.normalBias = 0.012;
      scene.add(keyLight);

      // Soft Fill Light (front-right)
      const fillLight = new THREE.DirectionalLight(0xf6f8ff, 0.62);
      fillLight.position.set(4.2, 2.2, 4.0);
      scene.add(fillLight);

      // Rim / Back Light (illuminates back cotton paper & flap edges in 360° views)
      const rimLight = new THREE.DirectionalLight(0xfffaf0, 0.95);
      rimLight.position.set(1.5, 3.6, -5.2);
      scene.add(rimLight);

      // Build and add the 3D Envelope & Message Card Assembly
      const envelopeAssembly = buildEnvelopeAndCardAssembly();
      scene.add(envelopeAssembly.rootGroup);

      // Soft standing contact shadow directly beneath the envelope (visible from above only)
      const shadowGeo = new THREE.PlaneGeometry(4.2, 1.35);
      shadowGeo.rotateX(-Math.PI / 2);
      const shadowMat = new THREE.MeshBasicMaterial({
        map: createStandingShadowTexture(),
        transparent: true,
        depthWrite: false,
        side: THREE.FrontSide
      });
      const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
      shadowMesh.position.set(0, envelopeAssembly.bottomY - 0.004, 0.0);
      scene.add(shadowMesh);

      /**
       * ==========================================================================
       * 8. CAMERA PRESETS, SMOOTH TRANSITIONS & CARD SLIDE ANIMATION
       * ==========================================================================
       */
      const CAMERA_PRESETS = {
        // Front hero view matching message.jpg
        front: {
          pos: new THREE.Vector3(0.0, 0.56, 7.35),
          target: new THREE.Vector3(0.0, 0.56, 0.0)
        },
        // 3/4 diagonal perspective showcasing layered paper thickness & navy pocket depth
        angle34: {
          pos: new THREE.Vector3(3.35, 1.68, 5.45),
          target: new THREE.Vector3(0.0, 0.52, 0.0)
        },
        // Side profile showing card & flap layering
        side: {
          pos: new THREE.Vector3(5.65, 0.62, 0.25),
          target: new THREE.Vector3(0.0, 0.56, 0.0)
        },
        // Rear view of the elevated card showcasing the hand-drawn stars, hearts & emojis
        cardBack: {
          pos: new THREE.Vector3(0.0, 1.32, -5.65),
          target: new THREE.Vector3(0.0, 1.24, 0.0)
        },
        // Back view of the handmade cotton envelope
        back: {
          pos: new THREE.Vector3(0.0, 0.62, -7.25),
          target: new THREE.Vector3(0.0, 0.56, 0.0)
        },
        // Close-up on the cobalt blue handwritten message
        closeup: {
          pos: new THREE.Vector3(0.0, 0.92, 3.35),
          target: new THREE.Vector3(0.0, 0.88, 0.0)
        }
      };

      // Initialize at default Front view
      camera.position.copy(CAMERA_PRESETS.front.pos);
      controls.target.copy(CAMERA_PRESETS.front.target);
      controls.update();

      let camAnim = null;

      function animateCameraTo(presetKey) {
        const key = presetKey === 'reset' ? 'front' : presetKey;
        const preset = CAMERA_PRESETS[key];
        if (!preset) return;

        if (key === 'cardBack' && !isCardSlidOut) {
          setCardSlidOut(true);
        }

        camAnim = {
          startPos: camera.position.clone(),
          endPos: preset.pos.clone(),
          startTarget: controls.target.clone(),
          endTarget: preset.target.clone(),
          elapsed: 0,
          duration: 0.85
        };

        document.querySelectorAll('.cam-btn[data-preset]').forEach((btn) => {
          const btnKey = btn.getAttribute('data-preset');
          btn.classList.toggle('active', btnKey === key);
        });
      }

      // Cancel camera preset animation if user manually interacts
      controls.addEventListener('start', () => {
        camAnim = null;
      });

      // Card slide in/out toggle state
      let isCardSlidOut = false;
      let cardTargetY = envelopeAssembly.cardRestCenterY;
      const slideBtn = document.getElementById('toggle-slide-card');
      const slideDot = document.getElementById('slide-dot');

      function setCardSlidOut(slidOut) {
        isCardSlidOut = slidOut;
        cardTargetY = slidOut
          ? envelopeAssembly.cardSlideOutCenterY
          : envelopeAssembly.cardRestCenterY;

        if (slidOut) {
          slideBtn.classList.add('active');
          slideDot.classList.remove('bg-slate-300');
          slideDot.classList.add('bg-white');
        } else {
          slideBtn.classList.remove('active');
          slideDot.classList.remove('bg-white');
          slideDot.classList.add('bg-slate-300');
        }

        // Smoothly adjust camera vertical framing so the revealed lower message lines stay centered
        const targetY = slidOut ? 1.06 : 0.56;
        const currentOffset = camera.position.clone().sub(controls.target);
        const endTarget = new THREE.Vector3(controls.target.x, targetY, controls.target.z);
        const endPos = endTarget.clone().add(currentOffset);

        camAnim = {
          startPos: camera.position.clone(),
          endPos,
          startTarget: controls.target.clone(),
          endTarget,
          elapsed: 0,
          duration: 0.75
        };
      }

      slideBtn.addEventListener('click', () => {
        setCardSlidOut(!isCardSlidOut);
      });

      // Allow clicking/tapping directly on the 3D card mesh to slide it in or out
      const raycaster = new THREE.Raycaster();
      const pointerDownPos = new THREE.Vector2();
      renderer.domElement.addEventListener('pointerdown', (e) => {
        pointerDownPos.set(e.clientX, e.clientY);
      });
      renderer.domElement.addEventListener('pointerup', (e) => {
        if (Math.hypot(e.clientX - pointerDownPos.x, e.clientY - pointerDownPos.y) > 6) return;
        const rect = renderer.domElement.getBoundingClientRect();
        const ndc = new THREE.Vector2(
          ((e.clientX - rect.left) / rect.width) * 2 - 1,
          -((e.clientY - rect.top) / rect.height) * 2 + 1
        );
        raycaster.setFromCamera(ndc, camera);
        if (raycaster.intersectObject(envelopeAssembly.cardMesh, false).length > 0) {
          setCardSlidOut(!isCardSlidOut);
        }
      });

      // Auto-rotate toggle state
      const autoRotateBtn = document.getElementById('toggle-autorotate');
      const autoRotateDot = document.getElementById('autorotate-dot');

      function setAutoRotate(enabled) {
        controls.autoRotate = enabled;
        controls.autoRotateSpeed = 1.65;
        if (enabled) {
          autoRotateBtn.classList.add('active');
          autoRotateDot.classList.remove('bg-slate-300');
          autoRotateDot.classList.add('bg-white');
        } else {
          autoRotateBtn.classList.remove('active');
          autoRotateDot.classList.remove('bg-white');
          autoRotateDot.classList.add('bg-slate-300');
        }
      }

      autoRotateBtn.addEventListener('click', () => {
        setAutoRotate(!controls.autoRotate);
      });

      // Bind camera preset & reset buttons
      document.querySelectorAll('.cam-btn[data-preset]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const preset = btn.getAttribute('data-preset');
          if (preset === 'reset') {
            if (controls.autoRotate) setAutoRotate(false);
            if (isCardSlidOut) setCardSlidOut(false);
          }
          animateCameraTo(preset);
        });
      });

      // Responsive window resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Fade out loading overlay once first frame renders
      const loadingOverlay = document.getElementById('loading-overlay');
      requestAnimationFrame(() => {
        renderer.render(scene, camera);
        loadingOverlay.style.opacity = '0';
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 500);
      });

      // Main animation loop
      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);

        // Smoothly interpolate message card vertical position when toggled
        const currentCardY = envelopeAssembly.cardMesh.position.y;
        if (Math.abs(cardTargetY - currentCardY) > 0.0005) {
          const lerpFactor = 1 - Math.exp(-7.5 * dt);
          envelopeAssembly.cardMesh.position.y += (cardTargetY - currentCardY) * lerpFactor;
        }

        // Smooth camera preset transition
        if (camAnim) {
          camAnim.elapsed += dt;
          const t = Math.min(1, camAnim.elapsed / camAnim.duration);
          const ease = 1 - Math.pow(1 - t, 3);

          camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
          controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);

          if (t >= 1) {
            camAnim = null;
          }
        }

        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    }

    window.addEventListener('DOMContentLoaded', () => {
      try {
        initApp();
      } catch (err) {
        console.error('Message Card 3D Viewer initialization error:', err);
        const errorBox = document.getElementById('error-box');
        const errorMsg = document.getElementById('error-message');
        if (errorBox && errorMsg) {
          errorMsg.textContent = 'お使いのブラウザ環境でWebGLを初期化できませんでした。ページを再読み込みしてお試しください。';
          errorBox.classList.remove('hidden');
        }
      }
    });
  </script>
</body>
</html>
