<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Birthday Kuji</title>
<style>
:root{--bg:#f4f1ea;--fg:#0c0c0c;--muted:#6b675e;--line:#d8d3c7;--accent:#95bf47;--chip:#0c0c0c;--chipfg:#f4f1ea;--card:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0b0b0b;--fg:#f2efe8;--muted:#8d8a82;--line:#262626;--accent:#a8e05f;--chip:#f2efe8;--chipfg:#0b0b0b;--card:#161616}}
:root[data-theme="dark"]{--bg:#0b0b0b;--fg:#f2efe8;--muted:#8d8a82;--line:#262626;--accent:#a8e05f;--chip:#f2efe8;--chipfg:#0b0b0b;--card:#161616}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Helvetica Neue",Helvetica,Arial,"Hiragino Sans","Noto Sans JP",sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;justify-content:space-between;padding:14px clamp(16px,4vw,48px);background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent)}
.btn{border-radius:999px;padding:9px 18px;font-size:14px;font-weight:600;border:1px solid var(--fg);background:var(--chip);color:var(--chipfg);cursor:pointer;font-family:inherit}
.btn.ghost{background:none;color:var(--fg);border-color:var(--line)}
.btn.sm{padding:5px 11px;font-size:12px}
.icon{background:none;border:1px solid var(--line);color:var(--fg);border-radius:50%;width:36px;height:36px;cursor:pointer}
main{padding:0 clamp(16px,4vw,48px)}
.hero{padding:clamp(48px,10vw,130px) 0 clamp(32px,6vw,70px)}
.hero h1{margin:0;font-size:clamp(40px,9vw,136px);line-height:.95;letter-spacing:-.045em;font-weight:600;max-width:13ch}
.hero h1 em{font-style:normal;color:var(--accent)}
.hero p{margin:24px 0 0;color:var(--muted);font-size:clamp(15px,1.6vw,20px);max-width:46ch;line-height:1.7}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:28px}
.bar small{color:var(--muted);font-size:12px;flex:1 1 260px;line-height:1.6}
.list-head{display:flex;justify-content:space-between;border-bottom:1px solid var(--fg);padding-bottom:12px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
ul{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:56px 96px 1fr auto;align-items:center;gap:18px;padding:22px 0;border-bottom:1px solid var(--line)}
.no{font-size:14px;color:var(--muted)}.no b{display:block;color:var(--fg);font-size:22px;letter-spacing:-.03em}
.thumb{width:96px;height:96px;border-radius:16px;overflow:hidden;display:grid;place-items:center;font-size:44px;background:var(--card);border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.title{font-size:clamp(26px,4.6vw,64px);letter-spacing:-.045em;line-height:1.05;font-weight:600;transition:color .25s,transform .35s cubic-bezier(.2,.8,.2,1)}
.row:hover .title{color:var(--accent);transform:translateX(8px)}
.sub{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12px}.chip.on{background:var(--accent);color:#0b0b0b;border-color:var(--accent)}
.qr{background:#fff;padding:6px;border-radius:10px;line-height:0}
.qr img,.qr canvas{width:96px!important;height:96px!important}
@media(max-width:700px){.row{grid-template-columns:44px 72px 1fr}.thumb{width:72px;height:72px;font-size:32px}.qr{grid-column:2/-1;justify-self:start}}
.center{min-height:calc(100vh - 140px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding:36px 0 56px;text-align:center}

/* ==========================================================================
   本物の一番くじ風「めくる」くじ券ステージ
   ========================================================================== */
.ik-wrap{width:min(100%,440px);display:flex;flex-direction:column;align-items:center;gap:18px;perspective:1200px}
.ik-ticket{
  position:relative;
  width:100%;
  aspect-ratio:1.58/1;
  border-radius:6px;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
  cursor:grab;
  transform-style:preserve-3d;
  filter:drop-shadow(0 18px 34px rgba(0,0,0,.22));
  transition:transform .25s cubic-bezier(.2,.8,.2,1);
}
.ik-ticket.dragging{cursor:grabbing}
.ik-ticket.opened{cursor:pointer}

.ik-base{
  position:absolute;
  inset:0;
  border-radius:6px;
  overflow:hidden;
  background:linear-gradient(160deg,#b9bbc1 0%,#a3a6ad 55%,#92959c 100%);
  border:1px solid rgba(0,0,0,.18);
}
.ik-base::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.22;
  pointer-events:none;
  background-image:radial-gradient(rgba(0,0,0,.16) .6px,transparent .6px),radial-gradient(rgba(255,255,255,.2) .6px,transparent .6px);
  background-size:14px 14px;
  background-position:0 0,7px 7px;
}

.ik-inside{
  position:absolute;
  left:5.5%;
  right:5.5%;
  top:8.5%;
  bottom:8.5%;
  display:grid;
  grid-template-columns:33% 1fr;
  gap:4%;
  align-items:center;
  padding:3.5% 4%;
  background:#fbfaf6;
  border-radius:3px;
  box-shadow:0 1px 3px rgba(0,0,0,.28),inset 0 0 0 1px rgba(0,0,0,.05);
  color:#141414;
}
.ik-in-left{display:flex;flex-direction:column;align-items:flex-start;gap:7%;min-width:0}
.ik-qr{width:100%;aspect-ratio:1;background:#fff;border:1px solid rgba(0,0,0,.14);line-height:0}
.ik-qr svg{width:100%;height:100%;display:block}
.ik-serial-row{display:flex;align-items:center;gap:6px;width:100%}
.ik-disc{
  flex:none;
  width:clamp(16px,6vw,26px);
  aspect-ratio:1;
  border-radius:50%;
  background:conic-gradient(#ff5fa2 0 25%,#2a2a2e 0 50%,#ff5fa2 0 75%,#2a2a2e 0);
  box-shadow:inset 0 0 0 2px #fff,0 0 0 1px rgba(0,0,0,.15);
}
.ik-serial{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:clamp(6.5px,1.7vw,8.5px);
  letter-spacing:.03em;
  color:#444;
  line-height:1.2;
  word-break:break-all;
}
.ik-in-right{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;min-width:0}
.ik-inside-top{
  display:flex;
  align-items:center;
  max-width:100%;
  font-size:clamp(8px,2.1vw,11px);
  font-weight:800;
  letter-spacing:.04em;
  white-space:nowrap;
  color:#b91c1c;
  border:1.5px solid #b91c1c;
  padding:2px 8px;
  border-radius:999px;
  background:#fff8f8;
}
.ik-inside-rank{
  margin:4px 0 2px;
  font-size:clamp(40px,11.5vw,60px);
  font-weight:900;
  line-height:1;
  letter-spacing:-.04em;
  background:linear-gradient(180deg,#e11d48 0%,#9f1239 100%);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.9));
}
.ik-inside-sub{
  font-size:clamp(10px,2.6vw,13px);
  font-weight:700;
  color:#333;
  letter-spacing:.02em;
  line-height:1.35;
}
.ik-inside-tap{
  margin-top:6px;
  font-size:11px;
  font-weight:700;
  color:#fff;
  background:#111;
  padding:4px 12px;
  border-radius:999px;
  opacity:0;
  transform:translateY(4px);
  transition:opacity .3s,transform .3s;
}
.ik-ticket.opened .ik-inside-tap{opacity:1;transform:none}

.ik-cover-clip{
  position:absolute;
  inset:0;
  border-radius:6px;
  overflow:hidden;
  pointer-events:none;
  will-change:clip-path;
}
.ik-face{
  position:absolute;
  inset:0;
  background:linear-gradient(165deg,#45a8ea 0%,#359be0 48%,#2b89ca 100%);
  color:#fff;
  overflow:hidden;
}
.ik-face::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.16;
  pointer-events:none;
  background-image:radial-gradient(rgba(255,255,255,.55) .6px,transparent .6px),radial-gradient(rgba(0,30,60,.25) .6px,transparent .6px);
  background-size:12px 12px;
  background-position:0 0,6px 6px;
}
.ik-perforation{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
.ik-strip{
  position:absolute;
  left:4.2%;
  top:7.5%;
  bottom:7.5%;
  width:9.2%;
  background:#14171c;
  border-radius:999px;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 1px 2px rgba(0,30,60,.4);
  z-index:2;
}
.ik-strip span{
  writing-mode:vertical-rl;
  text-orientation:upright;
  color:#ffffff;
  font-weight:900;
  font-size:clamp(9px,2.35vw,12.5px);
  letter-spacing:.03em;
  line-height:1;
  white-space:nowrap;
}
.ik-notch{
  position:absolute;
  left:13.8%;
  top:20%;
  width:17.5%;
  height:52%;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:center;
  animation:nudgeTab 2.2s ease-in-out infinite;
}
.ik-ticket.dragging .ik-notch,
.ik-ticket.opened .ik-notch{
  animation:none;
}
@keyframes nudgeTab{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(3px)}
}
.ik-burst{
  position:absolute;
  left:32%;
  top:11%;
  width:31%;
  height:44%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:#111;
  z-index:2;
}
.ik-burst svg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  filter:drop-shadow(0 2px 6px rgba(255,255,255,.55));
}
.ik-burst-text{
  position:relative;
  z-index:1;
  font-size:clamp(8px,2vw,10.5px);
  font-weight:800;
  line-height:1.25;
  color:#111;
}
.ik-burst-id{
  display:inline-block;
  margin:2px 0;
  padding:1px 7px;
  background:#111;
  color:#fff;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:clamp(11px,2.8vw,14px);
  font-weight:900;
  letter-spacing:.06em;
  border-radius:2px;
}
.ik-meta{
  position:absolute;
  left:62%;
  right:5.5%;
  top:12%;
  text-align:center;
  color:#fff;
  z-index:2;
  text-shadow:0 1px 2px rgba(10,55,95,.32);
}
.ik-meta-series{
  font-size:clamp(9px,2.2vw,11.5px);
  font-weight:800;
  letter-spacing:.04em;
}
.ik-meta-title{
  font-size:clamp(12px,3.1vw,16.5px);
  font-weight:900;
  letter-spacing:-.02em;
  line-height:1.15;
  margin:2px 0 3px;
  white-space:nowrap;
}
.ik-meta-sub{
  font-size:clamp(7.5px,1.85vw,9.5px);
  font-weight:700;
  opacity:.95;
}
.ik-meta-price{
  font-size:clamp(10.5px,2.7vw,14px);
  font-weight:900;
  margin-top:2px;
  letter-spacing:-.01em;
}
.ik-meta-price small{font-size:.72em;font-weight:700}
.ik-note{
  position:absolute;
  left:33.5%;
  right:5.5%;
  top:54.5%;
  font-size:clamp(7.2px,1.75vw,9px);
  font-weight:700;
  line-height:1.32;
  color:#fff;
  text-align:left;
  z-index:2;
  text-shadow:0 1px 1px rgba(10,55,95,.25);
}
.ik-barcode{
  position:absolute;
  left:33.5%;
  right:8.5%;
  bottom:10.5%;
  height:25.5%;
  background:#ffffff;
  border-radius:2px;
  padding:3px 10px 2px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  z-index:2;
  box-shadow:0 1px 2px rgba(0,40,80,.15);
}
.ik-bars{
  width:100%;
  height:68%;
  display:flex;
  align-items:stretch;
  justify-content:space-between;
}
.ik-bars i{
  display:block;
  background:#111;
  height:100%;
}
.ik-bar-nums{
  display:flex;
  justify-content:space-between;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:clamp(9px,2.3vw,12px);
  font-weight:800;
  color:#111;
  letter-spacing:.12em;
  line-height:1;
}

.ik-crease-shadow{
  position:absolute;
  top:0;
  bottom:0;
  width:22px;
  pointer-events:none;
  opacity:0;
  background:linear-gradient(90deg,rgba(0,0,0,0) 0%,rgba(0,0,0,.2) 70%,rgba(0,0,0,.36) 100%);
  transform:translateX(-100%);
  will-change:left,opacity;
}
.ik-flap{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:0;
  opacity:0;
  pointer-events:none;
  transform-origin:left center;
  filter:drop-shadow(8px 6px 10px rgba(0,0,0,.34));
  will-change:left,width,transform,opacity;
  z-index:5;
}
.ik-flap-body{
  position:absolute;
  inset:0;
  overflow:hidden;
  background:linear-gradient(90deg,#05070a 0%,#171b22 38%,#10131a 100%);
  clip-path:polygon(0 0,100% 4%,100% 96%,0 100%);
}
.ik-flap-body::before{
  content:"";
  position:absolute;
  inset:0;
  pointer-events:none;
  background:linear-gradient(90deg,rgba(0,0,0,.55),rgba(0,0,0,0) 36%);
}
.ik-flap-content{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:.15em;
  font-weight:900;
  color:#fff;
  white-space:nowrap;
}
.ik-fl-a{font-size:4.4em;line-height:.95;letter-spacing:-.03em;color:#74c4ff}
.ik-fl-k{font-size:1.9em;line-height:1;color:#fff}
.ik-fl-s{margin-top:.55em;font-size:.52em;font-weight:800;letter-spacing:.14em;color:#8ec9f5}
.ik-roll{
  position:absolute;
  top:0;
  bottom:0;
  left:0;
  width:0;
  opacity:0;
  pointer-events:none;
  border-radius:3px;
  background:linear-gradient(90deg,#1a6aa6 0%,#4fb3f6 20%,#b7e2ff 36%,#359be0 52%,#1b2530 76%,#05070a 100%);
  box-shadow:0 0 8px rgba(0,0,0,.4),inset 0 0 0 1px rgba(255,255,255,.12);
  will-change:left,width,opacity;
  z-index:6;
}
.ik-gl{position:fixed;left:0;top:0;display:block;pointer-events:none;z-index:30}
.ik-ticket.gl .ik-cover-clip,
.ik-ticket.gl .ik-crease-shadow,
.ik-ticket.gl .ik-flap,
.ik-ticket.gl .ik-roll{display:none}
.ik-frame{
  position:absolute;
  inset:0;
  border-radius:6px;
  overflow:hidden;
  pointer-events:none;
  clip-path:polygon(evenodd,0% 0%,100% 0%,100% 100%,0% 100%,0% 0%,0.000% 7.914%,26.818% 7.914%,31.364% 10.791%,87.727% 10.791%,91.818% 15.827%,91.818% 84.173%,87.727% 89.209%,31.364% 89.209%,26.818% 92.086%,0.000% 92.086%,0.000% 7.914%);
}
.ik-panel{
  position:absolute;
  inset:0;
  clip-path:polygon(0.000% 7.914%,26.818% 7.914%,31.364% 10.791%,87.727% 10.791%,91.818% 15.827%,91.818% 84.173%,87.727% 89.209%,31.364% 89.209%,26.818% 92.086%,0.000% 92.086%);
}
.ik-ticket.gl .ik-frame{display:none}
.ik-crease-shadow,.ik-flap,.ik-roll{top:7.9%;bottom:7.9%}
.ik-hint{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 16px;
  border-radius:999px;
  background:var(--card);
  border:1px solid var(--line);
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}
.ik-hint b{color:var(--fg)}

.prize{width:min(100%,460px);animation:pop .7s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:scale(.85) translateY(20px)}to{opacity:1;transform:none}}
.pimg{width:100%;aspect-ratio:1;border-radius:24px;overflow:hidden;display:grid;place-items:center;font-size:clamp(90px,28vw,150px);background:var(--card);border:1px solid var(--line)}
.pimg.is-3d{background:transparent;border:none;border-radius:0;aspect-ratio:1/1.05}
.pimg img,.pimg iframe{width:100%;height:100%;object-fit:cover;border:0;display:block;background:transparent}
.prize h2{font-size:clamp(34px,8vw,56px);letter-spacing:-.045em;margin:22px 0 10px;line-height:1.05}
.prize p{color:var(--muted);line-height:1.8;margin:0;white-space:pre-line}
#cf{position:fixed;inset:0;pointer-events:none;z-index:50}

.modal-backdrop{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.48);display:flex;align-items:center;justify-content:center;padding:16px}
.modal-card{width:min(100%,400px);background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal-card h3{margin:0 0 8px;font-size:18px}
.modal-card p{margin:0 0 16px;font-size:13px;color:var(--muted);line-height:1.6}
.modal-card input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:14px;margin-bottom:16px}
.modal-actions{display:flex;justify-content:flex-end;gap:8px}

footer{padding:48px clamp(16px,4vw,48px) 36px;border-top:1px solid var(--line);margin-top:60px;color:var(--muted);font-size:13px}
@media print{header,.bar,footer{display:none}.row{break-inside:avoid}}
</style>
</head>
<body>
<header><a class="brand" href="./"><span class="dot"></span>Birthday Kuji</a><button class="icon" id="theme" aria-label="テーマ切替">◐</button></header>
<main id="app"></main>
<canvas id="cf"></canvas>
<footer>© Birthday Kuji</footer>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ===== 景品設定：ここを書き換えてください ===== */

 {r:"A賞",n:"message",m:"あとでゆっくり読んでね。",e:"🧞",img:"img/3.jpg",view3d:"message3d.html"},
 {r:"N賞",n:"blueberry cheese cake",m:"かんなの大好きなチーズケーキ。",e:"🎂",img:"img/4.jpg",view3d:"blueberry3d.html"},

 {r:"A賞",n:"gerbera",m:"花言葉『あなたが私の運命の人』",e:"💐",img:"img/2.jpg",view3d:"gerbera3d.html"},
 {r:"H賞",n:"映画デート券",m:"観たい映画を選んでね。ポップコーン付き。",e:"🎬",img:""},
 {r:"B賞",n:"マッサージ30分",m:"肩も腰も、全力でほぐします。",e:"💆",img:""},
 {r:"D賞",n:"お揃いのプレゼント",m:"二人でお揃いにしたくて選びました。",e:"🎁",img:""}
];
var P=new URLSearchParams(location.search),app=document.getElementById("app");
function st(k,v){try{if(v===undefined)return localStorage.getItem(k);v===null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){return null}}
function media(p){return p.img?'<img src="'+p.img+'" alt="'+p.n+'">':p.e}

var audioCtx=null;
function playPaperTick(isSnap){
 try{
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!AC)return;
  if(!audioCtx)audioCtx=new AC();
  if(audioCtx.state==="suspended")audioCtx.resume();
  var dur=isSnap?0.16:0.042;
  var len=Math.floor(audioCtx.sampleRate*dur);
  var buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  var data=buf.getChannelData(0);
  for(var i=0;i<len;i++){
   var env=Math.exp(-i/(len*(isSnap?0.35:0.45)));
   data[i]=(Math.random()*2-1)*env;
  }
  var src=audioCtx.createBufferSource();
  src.buffer=buf;
  var filter=audioCtx.createBiquadFilter();
  filter.type="bandpass";
  filter.frequency.value=isSnap?1900:2900+Math.random()*900;
  filter.Q.value=isSnap?0.9:2.2;
  var gain=audioCtx.createGain();
  gain.gain.value=isSnap?0.18:0.08;
  src.connect(filter);filter.connect(gain);gain.connect(audioCtx.destination);
  src.start();
 }catch(e){}
}

 var ticket=document.getElementById("ikTicket"),
     cover=document.getElementById("ikCover"),
     crease=document.getElementById("ikCrease"),
     flap=document.getElementById("ikFlap"),
     roll=document.getElementById("ikRoll"),
     flapContent=document.getElementById("ikFlapContent"),
     hint=document.getElementById("ikHint");

 var progress=0,dragging=false,opened=false,startX=0,startY=0,startProg=0,lastTickStep=0,animId=null;

 function renderPeel(pVal,tiltDeg){
  if(GL){GL.render(pVal,tiltDeg||0);return}
  var w=ticket.clientWidth||360;
  var clamped=Math.max(0,Math.min(1.06,pVal));
  var peelPx=clamped*w;
  var pct=Math.min(100,clamped*100);

  cover.style.clipPath="inset(0 0 0 "+pct.toFixed(2)+"%)";
  cover.style.webkitClipPath="inset(0 0 0 "+pct.toFixed(2)+"%)";

  crease.style.left=peelPx.toFixed(1)+"px";
  crease.style.opacity=(clamped>0.01&&clamped<1.02)?Math.min(1,clamped*3.2).toFixed(2):"0";

  if(clamped<=0.005){
   flap.style.width="0px";
   flap.style.opacity="0";
   roll.style.width="0px";
   roll.style.opacity="0";
   return;
  }

  var fade=clamped>0.9?Math.max(0,(1.06-clamped)/0.16):1;
  var rollW=8+16*Math.min(1,clamped*2.2);
  roll.style.opacity=fade.toFixed(2);
  roll.style.left=(peelPx-rollW/2).toFixed(1)+"px";
  roll.style.width=rollW.toFixed(1)+"px";

  var flapMax=w*0.42;
  var flapW=Math.min(peelPx*1.8,flapMax);
  flap.style.opacity=fade.toFixed(2);
  flap.style.left=(peelPx+rollW/2-1).toFixed(1)+"px";
  flap.style.width=flapW.toFixed(1)+"px";
  flapContent.style.width=flapMax.toFixed(1)+"px";
  flapContent.style.fontSize=(w/22).toFixed(1)+"px";
  var curl=-(14+10*Math.min(1,clamped*2));
  var skew=tiltDeg||0;
  flap.style.transform="perspective(800px) rotateY("+curl.toFixed(1)+"deg) skewY("+skew.toFixed(2)+"deg)";
 }

 function animateTo(target,onDone){
  if(animId)cancelAnimationFrame(animId);
  var from=progress,t0=performance.now(),dur=target>0.5?340:380;
  function step(now){
   var t=Math.min(1,(now-t0)/dur);
   var ease=1-Math.pow(1-t,3);
   progress=from+(target-from)*ease;
   renderPeel(progress,0);
   if(t<1){animId=requestAnimationFrame(step)}
   else{animId=null;if(onDone)onDone()}
  }
  animId=requestAnimationFrame(step);
 }

 function completeOpen(){
  if(opened)return;
  opened=true;
  ticket.classList.remove("dragging");
  ticket.classList.add("opened");
  if(!prev)st(key,"1");
  playPaperTick(true);
  if(navigator.vibrate)try{navigator.vibrate([18,30,24])}catch(e){}
  hint.innerHTML="🎉 <b>"+p.r+"</b> 当選！景品を表示します…";
  animateTo(1.06,function(){
   confetti();
   setTimeout(function(){show(false)},1150);
  });
 }

 glDestroy();
 try{GL=glInit(ticket,id,rkBig,rkKan)}catch(err){GL=null;var oc=document.querySelector(".ik-gl");if(oc&&oc.parentNode)oc.parentNode.removeChild(oc)}
 if(GL)ticket.classList.add("gl");
 renderPeel(0,0);

 ticket.addEventListener("pointerdown",function(e){
  if(opened){show(false);return}
  if(animId){cancelAnimationFrame(animId);animId=null}
  dragging=true;
  startX=e.clientX;
  startY=e.clientY;
  startProg=progress;
  ticket.classList.add("dragging");
  ticket.setPointerCapture(e.pointerId);
 });

 ticket.addEventListener("pointermove",function(e){
  if(!dragging||opened)return;
  var w=ticket.clientWidth||360;
  var dx=e.clientX-startX;
  var dy=e.clientY-startY;
  var nextProg=Math.max(0,Math.min(1,startProg+(dx/(w*0.86))));
  progress=nextProg;
  var tilt=Math.max(-3.5,Math.min(3.5,dy*0.035));
  renderPeel(progress,tilt);

  var tickStep=Math.floor(progress*12);
  if(tickStep!==lastTickStep&&progress>0.04){
   lastTickStep=tickStep;
   playPaperTick(false);
   if(navigator.vibrate)try{navigator.vibrate(7)}catch(err){}
  }

  if(progress>=0.82){
   dragging=false;
   completeOpen();
  }
 });

 function handleRelease(e){
  if(!dragging)return;
  dragging=false;
  ticket.classList.remove("dragging");
  if(opened)return;

  var dx=e&&typeof e.clientX==="number"?(e.clientX-startX):0;
  if(Math.abs(dx)<8&&progress<0.06){
   playPaperTick(false);
   animateTo(0.22,function(){
    setTimeout(function(){if(!dragging&&!opened)animateTo(0)},160);
   });
   return;
  }

  if(progress>=0.62){
   completeOpen();
  }else{
   animateTo(0);
  }
 }

 ticket.addEventListener("pointerup",handleRelease);
 ticket.addEventListener("pointercancel",handleRelease);
 ticket.addEventListener("keydown",function(e){
  if(e.key==="Enter"||e.key===" "){e.preventDefault();completeOpen()}
 });
}

/* ---- Canva連携用：SVG書き出しヘルパー ---- */
function triggerSVGDownload(svgText,filename){
 var blob=new Blob([svgText],{type:"image/svg+xml;charset=utf-8"});
 var url=URL.createObjectURL(blob);
 var a=document.createElement("a");
 a.href=url;
 a.download=filename;
 document.body.appendChild(a);
 a.click();
 setTimeout(function(){
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
 },1000);
}
