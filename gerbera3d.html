<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ガーベラ 3D ビューア</title>
  <!-- Tailwind CSS for clean studio UI -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    /* Minimal bright studio glassmorphism */
    .studio-pill {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.06), 0 1px 3px rgba(15, 23, 42, 0.03);
    }
    .cam-btn {
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cam-btn:hover {
      transform: translateY(-1px);
    }
    .cam-btn:active {
      transform: translateY(0) scale(0.97);
    }
    .cam-btn.active {
      background-color: #EA580C;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(234, 88, 12, 0.28);
    }
  </style>

  <!-- ES Module Import Map for Three.js & Official Addons -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <!-- Fullscreen Transparent 3D Canvas -->
  <div id="canvas-container"></div>

  <!-- Loading Overlay (Transparent background) -->
  <div id="loading-overlay" class="fixed inset-0 z-30 flex items-center justify-center transition-opacity duration-500 pointer-events-none">
    <div class="flex flex-col items-center gap-3">
      <div class="w-9 h-9 border-2 border-orange-200/60 border-t-[#F35B13] rounded-full animate-spin"></div>
    </div>
  </div>

  <!-- Error Message Box -->
  <div id="error-box" class="hidden fixed inset-0 z-40 flex items-center justify-center bg-slate-900/40 p-4">
    <div class="bg-white rounded-2xl p-6 max-w-md shadow-xl text-center">
      <h2 class="text-base font-bold text-slate-900 mb-2">3Dビューアの初期化エラー</h2>
      <p id="error-message" class="text-sm text-slate-600"></p>
    </div>
  </div>

  <!-- Bottom Floating Japanese Camera Preset Toolbar -->
  <nav aria-label="カメラ操作パネル" class="fixed bottom-3 sm:bottom-5 left-1/2 -translate-x-1/2 z-10 w-[calc(100vw-1rem)] max-w-3xl flex justify-center pointer-events-none">
    <div class="studio-pill rounded-2xl sm:rounded-full p-1.5 sm:px-2.5 sm:py-2 flex flex-wrap items-center justify-center gap-1 sm:gap-1.5 pointer-events-auto">
      <button type="button" data-preset="front" class="cam-btn active px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-orange-50">
        正面
      </button>
      <button type="button" data-preset="angle34" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-orange-50">
        斜め
      </button>
      <button type="button" data-preset="side" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-orange-50">
        真横
      </button>
      <button type="button" data-preset="back" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-orange-50">
        背面
      </button>
      <button type="button" data-preset="macro" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-orange-50">
        花芯アップ
      </button>

      <span class="hidden sm:inline-block w-px h-5 bg-slate-200 mx-1"></span>

      <button type="button" id="toggle-autorotate" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-orange-50 flex items-center gap-1.5">
        <span id="autorotate-dot" class="w-2 h-2 rounded-full bg-slate-300 transition-colors"></span>
        <span>自動回転</span>
      </button>

      <button type="button" data-preset="reset" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-orange-50">
        リセット
      </button>
    </div>
  </nav>

  <!-- Main Three.js Application Script -->
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

    function createSeededRandom(seed = 4219) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function createPetalTextures() {
      const w = 512;
      const h = 1024;

      const colorCanvas = document.createElement('canvas');
      colorCanvas.width = w;
      colorCanvas.height = h;
      const cCtx = colorCanvas.getContext('2d');

      const bumpCanvas = document.createElement('canvas');
      bumpCanvas.width = w;
      bumpCanvas.height = h;
      const bCtx = bumpCanvas.getContext('2d');

      const roughCanvas = document.createElement('canvas');
      roughCanvas.width = w;
      roughCanvas.height = h;
      const rCtx = roughCanvas.getContext('2d');

      const grad = cCtx.createLinearGradient(0, h, 0, 0);
      grad.addColorStop(0.00, '#B92905');
      grad.addColorStop(0.14, '#D63D0B');
      grad.addColorStop(0.36, '#F35B13');
      grad.addColorStop(0.72, '#FA6B1C');
      grad.addColorStop(0.92, '#FF8128');
      grad.addColorStop(1.00, '#FF8F38');
      cCtx.fillStyle = grad;
      cCtx.fillRect(0, 0, w, h);

      const edgeGrad = cCtx.createLinearGradient(0, 0, w, 0);
      edgeGrad.addColorStop(0.00, 'rgba(255, 165, 85, 0.26)');
      edgeGrad.addColorStop(0.16, 'rgba(255, 140, 60, 0.0)');
      edgeGrad.addColorStop(0.50, 'rgba(180, 40, 5, 0.08)');
      edgeGrad.addColorStop(0.84, 'rgba(255, 140, 60, 0.0)');
      edgeGrad.addColorStop(1.00, 'rgba(255, 165, 85, 0.26)');
      cCtx.fillStyle = edgeGrad;
      cCtx.fillRect(0, 0, w, h);

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, w, h);

      rCtx.fillStyle = '#929292';
      rCtx.fillRect(0, 0, w, h);

      const rand = createSeededRandom(9012);
      const veinCount = 96;
      for (let i = 0; i < veinCount; i++) {
        const u = (i + 0.5) / veinCount;
        const xBase = w * 0.5 + (u - 0.5) * w * 0.55;
        const xMid = u * w + (rand() - 0.5) * 6;
        const xTip = w * 0.5 + (u - 0.5) * w * 0.78;

        const isPrimaryVein = i % 6 === 0;
        const lineW = isPrimaryVein ? 2.4 : 1.1;

        cCtx.beginPath();
        cCtx.moveTo(xBase, h);
        cCtx.quadraticCurveTo(xMid, h * 0.5, xTip, 0);
        cCtx.strokeStyle = isPrimaryVein
          ? 'rgba(175, 42, 6, 0.22)'
          : rand() > 0.5
            ? 'rgba(255, 158, 72, 0.16)'
            : 'rgba(195, 52, 10, 0.12)';
        cCtx.lineWidth = lineW;
        cCtx.stroke();

        bCtx.beginPath();
        bCtx.moveTo(xBase, h);
        bCtx.quadraticCurveTo(xMid, h * 0.5, xTip, 0);
        bCtx.strokeStyle = isPrimaryVein ? 'rgba(45, 45, 45, 0.55)' : 'rgba(215, 215, 215, 0.35)';
        bCtx.lineWidth = lineW;
        bCtx.stroke();

        rCtx.beginPath();
        rCtx.moveTo(xBase, h);
        rCtx.quadraticCurveTo(xMid, h * 0.5, xTip, 0);
        rCtx.strokeStyle = isPrimaryVein ? 'rgba(180, 180, 180, 0.3)' : 'rgba(115, 115, 115, 0.25)';
        rCtx.lineWidth = lineW;
        rCtx.stroke();
      }

      const bImg = bCtx.getImageData(0, 0, w, h);
      const bData = bImg.data;
      for (let i = 0; i < bData.length; i += 4) {
        const grain = (rand() - 0.5) * 24;
        const val = Math.max(0, Math.min(255, bData[i] + grain));
        bData[i] = val;
        bData[i + 1] = val;
        bData[i + 2] = val;
      }
      bCtx.putImageData(bImg, 0, 0);

      const colorMap = new THREE.CanvasTexture(colorCanvas);
      colorMap.colorSpace = THREE.SRGBColorSpace;
      colorMap.anisotropy = 8;

      const bumpMap = new THREE.CanvasTexture(bumpCanvas);
      bumpMap.anisotropy = 4;

      const roughnessMap = new THREE.CanvasTexture(roughCanvas);
      roughnessMap.anisotropy = 4;

      return { colorMap, bumpMap, roughnessMap };
    }

    function createDiscCushionTextures() {
      const size = 512;
      const cCanvas = document.createElement('canvas');
      cCanvas.width = size;
      cCanvas.height = size;
      const ctx = cCanvas.getContext('2d');

      const bCanvas = document.createElement('canvas');
      bCanvas.width = size;
      bCanvas.height = size;
      const bCtx = bCanvas.getContext('2d');

      const cx = size / 2;
      const cy = size / 2;

      const grad = ctx.createRadialGradient(cx, cy, 8, cx, cy, size * 0.5);
      grad.addColorStop(0.0, '#E8B228');
      grad.addColorStop(0.65, '#DFA31F');
      grad.addColorStop(0.90, '#CE8818');
      grad.addColorStop(1.0, '#C46C22');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, size, size);

      bCtx.fillStyle = '#555555';
      bCtx.fillRect(0, 0, size, size);

      const goldenAngle = Math.PI * (3 - Math.sqrt(5));
      const count = 650;
      for (let i = 0; i < count; i++) {
        const rNorm = Math.sqrt(i / count);
        const r = rNorm * (size * 0.48);
        const theta = i * goldenAngle;
        const x = cx + Math.cos(theta) * r;
        const y = cy + Math.sin(theta) * r;
        const dotR = 3.2 + rNorm * 2.2;

        ctx.beginPath();
        ctx.arc(x, y, dotR, 0, Math.PI * 2);
        ctx.fillStyle = i % 3 === 0 ? '#F3C744' : '#C98916';
        ctx.fill();

        const bGrad = bCtx.createRadialGradient(x, y, 0.5, x, y, dotR * 1.15);
        bGrad.addColorStop(0, '#FFFFFF');
        bGrad.addColorStop(1, '#3A3A3A');
        bCtx.fillStyle = bGrad;
        bCtx.beginPath();
        bCtx.arc(x, y, dotR * 1.15, 0, Math.PI * 2);
        bCtx.fill();
      }

      const colorMap = new THREE.CanvasTexture(cCanvas);
      colorMap.colorSpace = THREE.SRGBColorSpace;
      const bumpMap = new THREE.CanvasTexture(bCanvas);
      return { colorMap, bumpMap };
    }

    function createSageStemTextures() {
      const w = 256;
      const h = 1024;
      const cCanvas = document.createElement('canvas');
      cCanvas.width = w;
      cCanvas.height = h;
      const ctx = cCanvas.getContext('2d');

      const bCanvas = document.createElement('canvas');
      bCanvas.width = w;
      bCanvas.height = h;
      const bCtx = bCanvas.getContext('2d');

      ctx.fillStyle = '#959D8A';
      ctx.fillRect(0, 0, w, h);

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, w, h);

      const rand = createSeededRandom(3141);

      for (let i = 0; i < 64; i++) {
        const x = (i / 64) * w;
        const lineW = 1.5 + rand() * 2.5;
        ctx.fillStyle = i % 2 === 0 ? 'rgba(134, 143, 122, 0.42)' : 'rgba(172, 180, 162, 0.36)';
        ctx.fillRect(x, 0, lineW, h);

        bCtx.fillStyle = i % 2 === 0 ? 'rgba(65, 65, 65, 0.45)' : 'rgba(195, 195, 195, 0.45)';
        bCtx.fillRect(x, 0, lineW, h);
      }

      for (let i = 0; i < 1800; i++) {
        const x = rand() * w;
        const y = rand() * h;
        const rw = 1 + rand() * 3;
        const rh = 6 + rand() * 26;
        ctx.fillStyle = rand() > 0.48
          ? 'rgba(176, 183, 168, 0.16)'
          : 'rgba(124, 133, 113, 0.16)';
        ctx.fillRect(x, y, rw, rh);
      }

      const colorMap = new THREE.CanvasTexture(cCanvas);
      colorMap.colorSpace = THREE.SRGBColorSpace;
      colorMap.wrapS = THREE.RepeatWrapping;
      colorMap.wrapT = THREE.RepeatWrapping;
      colorMap.repeat.set(1, 3);

      const bumpMap = new THREE.CanvasTexture(bCanvas);
      bumpMap.wrapS = THREE.RepeatWrapping;
      bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(1, 3);

      return { colorMap, bumpMap };
    }

    function buildGerberaPetalGeometry({
      length = 1.0,
      maxWidth = 0.16,
      archZ = 0.14,
      recurveTip = -0.05,
      fluteDepth = 0.016,
      twistAngle = 0.0,
      lateralWave = 0.0,
      notchDepth = 0.022
    }) {
      const uSegs = 10;
      const vSegs = 20;

      const positions = [];
      const uvs = [];
      const indices = [];

      for (let iv = 0; iv <= vSegs; iv++) {
        const v = iv / vSegs;

        let widthEnvelope;
        if (v < 0.18) {
          widthEnvelope = 0.28 + 0.42 * (v / 0.18);
        } else if (v < 0.78) {
          const t = (v - 0.18) / 0.60;
          widthEnvelope = 0.70 + 0.30 * Math.sin(t * Math.PI * 0.65);
        } else {
          const t = (v - 0.78) / 0.22;
          widthEnvelope = 0.96 * Math.sqrt(Math.max(0.002, 1.0 - t * t));
        }

        const halfW = 0.5 * maxWidth * widthEnvelope;

        const zArch =
          archZ * Math.sin(v * Math.PI * 0.72) +
          recurveTip * Math.pow(Math.max(0, (v - 0.65) / 0.35), 2);

        const xSway = lateralWave * Math.sin(v * Math.PI * 1.15);
        const localTwist = twistAngle * Math.pow(v, 1.2);
        const cosTw = Math.cos(localTwist);
        const sinTw = Math.sin(localTwist);

        for (let iu = 0; iu <= uSegs; iu++) {
          const u = iu / uSegs;
          const s = (u - 0.5) * 2.0;

          const notchMask = Math.pow(v, 5) * Math.exp(-Math.pow(s / 0.26, 2));
          const sideLobeBoost = Math.pow(v, 4) * Math.exp(-Math.pow((Math.abs(s) -
