<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ブルーベリーチーズケーキ 3D ビューア</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent !important;
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
    }
    /* Minimal frosted studio glassmorphism */
    .studio-glass {
      background: rgba(255, 255, 255, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(226, 232, 240, 0.88);
      box-shadow: 0 8px 28px rgba(30, 27, 75, 0.08), 0 1px 3px rgba(30, 27, 75, 0.04);
    }
    .cam-btn {
      transition: all 0.2s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .cam-btn:hover {
      transform: translateY(-1px);
    }
    .cam-btn:active {
      transform: translateY(0) scale(0.97);
    }
    .cam-btn.active {
      background-color: #3B2874;
      color: #FFFFFF;
      box-shadow: 0 4px 12px rgba(59, 40, 116, 0.28);
    }
  </style>
</head>
<body>
  <!-- Fullscreen Transparent 3D Canvas Container -->
  <div id="canvas-container"></div>

  <!-- Transparent Loading Spinner -->
  <div id="loading-overlay" class="fixed inset-0 z-30 flex items-center justify-center transition-opacity duration-300 pointer-events-none">
    <div class="w-8 h-8 border-2 border-indigo-200/60 border-t-[#3B2874] rounded-full animate-spin"></div>
  </div>

  <!-- Error Message Box (Hidden unless WebGL/network fails) -->
  <div id="error-box" class="hidden fixed inset-0 z-40 flex items-center justify-center p-4 pointer-events-none">
    <div class="bg-white/95 backdrop-blur rounded-2xl p-5 max-w-sm shadow-lg border border-slate-200 text-center pointer-events-auto">
      <h2 class="text-sm font-bold text-slate-900 mb-1.5">3Dモデルを表示できませんでした</h2>
      <p id="error-message" class="text-xs text-slate-600 leading-relaxed"></p>
    </div>
  </div>

  <!-- Bottom Floating Camera Preset & Auto-Rotate Toolbar -->
  <nav aria-label="カメラ操作パネル" class="fixed bottom-3 sm:bottom-5 left-1/2 -translate-x-1/2 z-10 w-[calc(100vw-1rem)] max-w-3xl flex justify-center pointer-events-none">
    <div class="studio-glass rounded-2xl sm:rounded-full p-1.5 sm:px-2.5 sm:py-2 flex flex-wrap items-center justify-center gap-1 sm:gap-1.5 pointer-events-auto">
      <button type="button" data-preset="hero" class="cam-btn active px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50">
        斜め正面
      </button>
      <button type="button" data-preset="top" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50">
        真上から
      </button>
      <button type="button" data-preset="side" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50">
        真横から
      </button>
      <button type="button" data-preset="macro" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50">
        ベリー拡大
      </button>
      <button type="button" data-preset="candle" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50">
        ロウソク拡大
      </button>
      <button type="button" data-preset="bottom" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50">
        底面生地
      </button>

      <span class="hidden sm:inline-block w-px h-5 bg-slate-200 mx-0.5"></span>

      <button type="button" id="toggle-flame" class="cam-btn active px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50 flex items-center gap-1.5">
        <span id="flame-dot" class="w-2 h-2 rounded-full bg-amber-300 transition-colors"></span>
        <span>キャンドル点灯</span>
      </button>

      <button type="button" id="toggle-autorotate" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50 flex items-center gap-1.5">
        <span id="autorotate-dot" class="w-2 h-2 rounded-full bg-slate-300 transition-colors"></span>
        <span>自動回転</span>
      </button>

      <button type="button" data-preset="reset" class="cam-btn px-3 py-1.5 sm:px-3.5 sm:py-1.5 rounded-xl sm:rounded-full text-xs font-semibold text-slate-700 hover:bg-indigo-50">
        リセット
      </button>
    </div>
  </nav>

  <!-- Main Three.js Application Script -->
  <script type="module">
    function hideLoader() {
      const loadingOverlay = document.getElementById('loading-overlay');
      if (loadingOverlay) {
        loadingOverlay.style.opacity = '0';
        setTimeout(() => {
          loadingOverlay.style.display = 'none';
        }, 250);
      }
    }

    function showError(text) {
      const loadingOverlay = document.getElementById('loading-overlay');
      if (loadingOverlay) loadingOverlay.style.display = 'none';
      const errorBox = document.getElementById('error-box');
      const errorMsg = document.getElementById('error-message');
      if (errorBox && errorMsg) {
        errorMsg.textContent = text;
        errorBox.classList.remove('hidden');
      }
    }

    function importWithTimeout(url, ms = 4500) {
      return Promise.race([
        import(url),
        new Promise((_, reject) => setTimeout(() => reject(new Error('Timeout: ' + url)), ms))
      ]);
    }

    async function loadThreeCore() {
      const cdnUrls = [
        'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js',
        'https://unpkg.com/three@0.170.0/build/three.module.js',
        'https://esm.sh/three@0.170.0'
      ];
      let lastErr = null;
      for (const url of cdnUrls) {
        try {
          const mod = await importWithTimeout(url, 4500);
          if (mod && mod.WebGLRenderer) return mod;
        } catch (err) {
          lastErr = err;
        }
      }
      throw lastErr || new Error('Failed to load Three.js');
    }

    // Built-in smooth 360-degree Orbit/Pinch/Pan controller (zero external addon dependency)
    function createBuiltInOrbitController(THREE, camera, domElement) {
      const target = new THREE.Vector3();
      const spherical = new THREE.Spherical();
      const sphericalDelta = new THREE.Spherical();
      const panOffset = new THREE.Vector3();
      let scale = 1;

      const listeners = { start: [] };
      const pointers = new Map();
      let prevPinchDist = 0;
      let mode = 'none';
      let prevX = 0;
      let prevY = 0;

      const controller = {
        target,
        enableDamping: true,
        dampingFactor: 0.065,
        rotateSpeed: 0.85,
        zoomSpeed: 0.95,
        panSpeed: 0.8,
        minDistance: 1.65,
        maxDistance: 14.0,
        minPolarAngle: 0.03,
        maxPolarAngle: Math.PI - 0.03,
        autoRotate: false,
        autoRotateSpeed: 1.65,
        addEventListener(type, fn) {
          if (listeners[type]) listeners[type].push(fn);
        },
        update() {
          const offset = new THREE.Vector3().copy(camera.position).sub(target);
          spherical.setFromVector3(offset);

          if (controller.autoRotate && mode === 'none') {
            sphericalDelta.theta -= ((2 * Math.PI) / 60 / 60) * controller.autoRotateSpeed;
          }

          if (controller.enableDamping) {
            spherical.theta += sphericalDelta.theta * controller.dampingFactor;
            spherical.phi += sphericalDelta.phi * controller.dampingFactor;
          } else {
            spherical.theta += sphericalDelta.theta;
            spherical.phi += sphericalDelta.phi;
          }

          spherical.phi = Math.max(controller.minPolarAngle, Math.min(controller.maxPolarAngle, spherical.phi));
          spherical.makeSafe();
          spherical.radius *= scale;
          spherical.radius = Math.max(controller.minDistance, Math.min(controller.maxDistance, spherical.radius));

          if (controller.enableDamping) {
            target.addScaledVector(panOffset, controller.dampingFactor);
            panOffset.multiplyScalar(1 - controller.dampingFactor);
            sphericalDelta.theta *= 1 - controller.dampingFactor;
            sphericalDelta.phi *= 1 - controller.dampingFactor;
          } else {
            target.add(panOffset);
            panOffset.set(0, 0, 0);
            sphericalDelta.set(0, 0, 0);
          }

          scale = 1;
          offset.setFromSpherical(spherical);
          camera.position.copy(target).add(offset);
          camera.lookAt(target);
        }
      };

      function notifyStart() {
        for (const fn of listeners.start) fn();
      }

      function pan(deltaX, deltaY) {
        const element = domElement;
        const offset = new THREE.Vector3().copy(camera.position).sub(target);
        let targetDistance = offset.length();
        targetDistance *= Math.tan(((camera.fov / 2) * Math.PI) / 180.0);

        const panLeftDist = (2 * deltaX * targetDistance) / (element.clientHeight || 1);
        const panUpDist = (2 * deltaY * targetDistance) / (element.clientHeight || 1);

        const v = new THREE.Vector3();
        v.setFromMatrixColumn(camera.matrix, 0);
        v.multiplyScalar(-panLeftDist * controller.panSpeed);
        panOffset.add(v);

        v.setFromMatrixColumn(camera.matrix, 1);
        v.multiplyScalar(panUpDist * controller.panSpeed);
        panOffset.add(v);
      }

      domElement.addEventListener('contextmenu', (e) => e.preventDefault());

      domElement.addEventListener('pointerdown', (e) => {
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
        domElement.setPointerCapture(e.pointerId);
        notifyStart();

        if (pointers.size === 1) {
          prevX = e.clientX;
          prevY = e.clientY;
          mode = e.button === 2 || e.button === 1 || e.shiftKey ? 'pan' : 'rotate';
        } else if (pointers.size === 2) {
          const pts = Array.from(pointers.values());
          prevPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          prevX = (pts[0].x + pts[1].x) * 0.5;
          prevY = (pts[0].y + pts[1].y) * 0.5;
          mode = 'pinch';
        }
      });

      domElement.addEventListener('pointermove', (e) => {
        if (!pointers.has(e.pointerId)) return;
        pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

        if (pointers.size === 1 && (mode === 'rotate' || mode === 'pan')) {
          const dx = e.clientX - prevX;
          const dy = e.clientY - prevY;
          prevX = e.clientX;
          prevY = e.clientY;
          const h = domElement.clientHeight || 500;

          if (mode === 'rotate') {
            sphericalDelta.theta -= ((2 * Math.PI * dx) / h) * controller.rotateSpeed;
            sphericalDelta.phi -= ((2 * Math.PI * dy) / h) * controller.rotateSpeed;
          } else {
            pan(dx, dy);
          }
        } else if (pointers.size === 2) {
          const pts = Array.from(pointers.values());
          const dist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
          if (prevPinchDist > 0 && dist > 0) {
            scale *= Math.pow(prevPinchDist / dist, controller.zoomSpeed);
          }
          prevPinchDist = dist;

          const cx = (pts[0].x + pts[1].x) * 0.5;
          const cy = (pts[0].y + pts[1].y) * 0.5;
          pan(cx - prevX, cy - prevY);
          prevX = cx;
          prevY = cy;
        }
      });

      function onPointerUp(e) {
        pointers.delete(e.pointerId);
        if (pointers.size === 0) {
          mode = 'none';
          prevPinchDist = 0;
        } else if (pointers.size === 1) {
          const rem = Array.from(pointers.values())[0];
          prevX = rem.x;
          prevY = rem.y;
          mode = 'rotate';
        }
      }

      domElement.addEventListener('pointerup', onPointerUp);
      domElement.addEventListener('pointercancel', onPointerUp);

      domElement.addEventListener(
        'wheel',
        (e) => {
          e.preventDefault();
          notifyStart();
          const zoomFactor = Math.pow(0.95, controller.zoomSpeed);
          if (e.deltaY < 0) {
            scale *= zoomFactor;
          } else if (e.deltaY > 0) {
            scale /= zoomFactor;
          }
        },
        { passive: false }
      );

      return controller;
    }

    // Studio IBL environment builder (zero external RoomEnvironment dependency)
    function createStudioEnvironmentScene(THREE) {
      const envScene = new THREE.Scene();
      envScene.background = new THREE.Color(0xf6f4f0);

      const boxGeo = new THREE.BoxGeometry(1, 1, 1);

      const topLight = new THREE.Mesh(
        boxGeo,
        new THREE.MeshBasicMaterial({ color: new THREE.Color(2.4, 2.38, 2.32) })
      );
      topLight.position.set(0, 6, 0);
      topLight.scale.set(8, 0.2, 8);
      envScene.add(topLight);

      const leftSoftbox = new THREE.Mesh(
        boxGeo,
        new THREE.MeshBasicMaterial({ color: new THREE.Color(2.1, 2.05, 1.98) })
      );
      leftSoftbox.position.set(-5, 3, 4);
      leftSoftbox.scale.set(0.2, 5, 6);
      envScene.add(leftSoftbox);

      const rightSoftbox = new THREE.Mesh(
        boxGeo,
        new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 1.7, 1.9) })
      );
      rightSoftbox.position.set(5, 2.5, 3);
      rightSoftbox.scale.set(0.2, 5, 6);
      envScene.add(rightSoftbox);

      const backStrip = new THREE.Mesh(
        boxGeo,
        new THREE.MeshBasicMaterial({ color: new THREE.Color(1.9, 1.88, 1.84) })
      );
      backStrip.position.set(0, 3.5, -5.5);
      backStrip.scale.set(7, 4, 0.2);
      envScene.add(backStrip);

      return envScene;
    }

    function createSeededRandom(seed = 20260714) {
      let s = seed % 2147483647;
      if (s <= 0) s += 2147483646;
      return () => {
        s = (s * 16807) % 2147483647;
        return (s - 1) / 2147483646;
      };
    }

    function createGrahamCrustTextures(THREE) {
      const size = 1024;
      const cCanvas = document.createElement('canvas');
      cCanvas.width = size;
      cCanvas.height = size;
      const ctx = cCanvas.getContext('2d');

      const bCanvas = document.createElement('canvas');
      bCanvas.width = size;
      bCanvas.height = size;
      const bCtx = bCanvas.getContext('2d');

      ctx.fillStyle = '#BC6F2B';
      ctx.fillRect(0, 0, size, size);

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, size, size);

      const rand = createSeededRandom(55109);

      const crumbColors = [
        '#D99148',
        '#C97A32',
        '#B26220',
        '#944B14',
        '#75370C',
        '#E4A562'
      ];

      for (let i = 0; i < 16000; i++) {
        const x = rand() * size;
        const y = rand() * size;
        const r = 1.2 + rand() * 4.4;
        const col = crumbColors[Math.floor(rand() * crumbColors.length)];

        ctx.fillStyle = col;
        ctx.beginPath();
        ctx.ellipse(x, y, r, r * (0.65 + rand() * 0.6), rand() * Math.PI, 0, Math.PI * 2);
        ctx.fill();

        const bVal = Math.floor(60 + rand() * 185);
        bCtx.fillStyle = `rgb(${bVal},${bVal},${bVal})`;
        bCtx.beginPath();
        bCtx.ellipse(x, y, r * 1.1, r * 0.85, rand() * Math.PI, 0, Math.PI * 2);
        bCtx.fill();
      }

      const stainGrad = ctx.createLinearGradient(0, 0, 0, size * 0.24);
      stainGrad.addColorStop(0.0, 'rgba(72, 8, 52, 0.55)');
      stainGrad.addColorStop(0.45, 'rgba(98, 16, 68, 0.22)');
      stainGrad.addColorStop(1.0, 'rgba(98, 16, 68, 0.0)');
      ctx.fillStyle = stainGrad;
      ctx.fillRect(0, 0, size, size * 0.24);

      const colorMap = new THREE.CanvasTexture(cCanvas);
      colorMap.colorSpace = THREE.SRGBColorSpace;
      colorMap.wrapS = THREE.RepeatWrapping;
      colorMap.wrapT = THREE.ClampToEdgeWrapping;
      colorMap.repeat.set(3, 1);
      colorMap.anisotropy = 16;

      const bumpMap = new THREE.CanvasTexture(bCanvas);
      bumpMap.wrapS = THREE.RepeatWrapping;
      bumpMap.wrapT = THREE.RepeatWrapping;
      bumpMap.repeat.set(3, 1);
      bumpMap.anisotropy = 8;

      return { colorMap, bumpMap };
    }

    function createCheesecakeBodyTextures(THREE) {
      const w = 2048;
      const h = 1024;

      const cCanvas = document.createElement('canvas');
      cCanvas.width = w;
      cCanvas.height = h;
      const ctx = cCanvas.getContext('2d');

      const bCanvas = document.createElement('canvas');
      bCanvas.width = w;
      bCanvas.height = h;
      const bCtx = bCanvas.getContext('2d');

      const rCanvas = document.createElement('canvas');
      rCanvas.width = w;
      rCanvas.height = h;
      const rCtx = rCanvas.getContext('2d');

      const baseGrad = ctx.createLinearGradient(0, 0, 0, h);
      baseGrad.addColorStop(0.00, '#FAF4E4');
      baseGrad.addColorStop(0.28, '#F5EDD8');
      baseGrad.addColorStop(0.75, '#EFE4CA');
      baseGrad.addColorStop(1.00, '#E7D8B9');
      ctx.fillStyle = baseGrad;
      ctx.fillRect(0, 0, w, h);

      bCtx.fillStyle = '#808080';
      bCtx.fillRect(0, 0, w, h);

      rCtx.fillStyle = '#747474';
      rCtx.fillRect(0, 0, w, h);

      const rand = createSeededRandom(83192);

      for (let i = 0; i < 180; i++) {
        const y = rand() * h;
        const thickness = 4 + rand() * 18;
        const waveAmp = 3 + rand() * 9;
        const freq = 1 + Math.floor(rand() * 4);
        const phase = rand() * Math.PI * 2;

        ctx.beginPath();
        bCtx.beginPath();
        for (let x = 0; x <= w; x += 32) {
          const u = x / w;
          const wy = y + Math.sin(u * Math.PI * 2 * freq + phase) * waveAmp;
          if (x === 0) {
            ctx.moveTo(x, wy);
            bCtx.moveTo(x, wy);
          } else {
            ctx.lineTo(x, wy);
            bCtx.lineTo(x, wy);
          }
        }
        ctx.strokeStyle = rand() > 0.5 ? 'rgba(255, 252, 244, 0.24)' : 'rgba(225, 210, 180, 0.22)';
        ctx.lineWidth = thickness;
        ctx.stroke();

        bCtx.strokeStyle = rand() > 0.5 ? 'rgba(175, 175, 175, 0.30)' : 'rgba(85, 85, 85, 0.30)';
        bCtx.lineWidth = thickness * 0.85;
        bCtx.stroke();
      }

      for (let i = 0; i < 3200; i++) {
        const x = rand() * w;
        const y = rand() * h;
        const rx = 1.0 + rand() * 3.8;
        const ry = 0.7 + rand() * 2.2;
        ctx.fillStyle = rand() > 0.35 ? 'rgba(226, 212, 184, 0.26)' : 'rgba(255, 253, 248, 0.28)';
        ctx.beginPath();
        ctx.ellipse(x, y, rx, ry, (rand() - 0.5) * 0.4, 0, Math.PI * 2);
        ctx.fill();

        bCtx.fillStyle = 'rgba(42, 42, 42, 0.32)';
        bCtx.beginPath();
        bCtx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
        bCtx.fill();
      }

      const seamSamples = 160;
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(0, h);
      for (let i = 0; i <= seamSamples; i++) {
        const u = i / seamSamples;
        const x = u * w;
        const wave =
          0.075 +
          0.032 * Math.sin(u * Math.PI * 2 * 5 + 0.4) +
          0.022 * Math.sin(u * Math.PI * 2 * 11 + 1.8) +
          0.012 * Math.cos(u * Math.PI * 2 * 19);
        const y = h * (1.0 - Math.max(0.02, wave));
        ctx.lineTo(x, y);
      }
      ctx.lineTo(w, h);
      ctx.closePath();

      const berrySeamGrad = ctx.createLinearGradient(0, h * 0.84, 0, h);
      berrySeamGrad.addColorStop(0.0, 'rgba(112, 18, 76, 0.78)');
      berrySeamGrad.addColorStop(0.35, 'rgba(72, 6, 52, 0.94)');
      berrySeamGrad.addColorStop(1.0, 'rgba(44, 4, 34, 0.98)');
      ctx.fillStyle = berrySeamGrad;
      ctx.fill();
      ctx.restore();

      for (let i = 0; i < 85; i++) {
        const u = rand();
        const x = u * w;
        const y = h * (0.87 + rand() * 0.12);
        const r = 4 + rand() * 14;
        ctx.fillStyle = rand() > 0.35 ? 'rgba(40, 5, 34, 0.85)' : 'rgba(128, 22, 86, 0.65)';
        ctx.beginPath();
        ctx.ellipse(x, y, r * 1.4, r * 0.75, (rand() - 0.5) * 0.5, 0, Math.PI * 2);
        ctx.fill();
      }

      for (let i = 0; i < 28; i++) {
        const x = rand() * w;
        const y = rand() * (h * 0.045);
        const r = 5 + rand() * 16;
        const dripGrad = ctx.createRadialGradient(x, y, 1, x, y, r);
        dripGrad.addColorStop(0, 'rgba(78, 8, 54, 0.82)');
        dripGrad.addColorStop(1, 'rgba(78, 8, 54, 0)');
        ctx.fillStyle = dripGrad;
        ctx.beginPath();
        ctx.arc(x, y, r, 0, Math.PI * 2);
        ctx.fill();
      }

      const colorMap = new THREE.CanvasTexture(cCanvas);
      colorMap.colorSpace = THREE.SRGBColorSpace;
      colorMap.wrapS = THREE.RepeatWrapping;
      colorMap.wrapT = THREE.ClampToEdgeWrapping;
      colorMap.anisotropy = 16;

      const bumpMap = new THREE.CanvasTexture(bCanvas);
      bumpMap.wrapS = THREE.RepeatWrapping;
      bumpMap.wrapT = THREE.ClampToEdgeWrapping;
      bumpMap.anisotropy = 8;

      const roughnessMap = new THREE.CanvasTexture(rCanvas);
      roughnessMap.wrapS = THREE.RepeatWrapping;
      roughnessMap.wrapT = THREE.ClampToEdgeWrapping;

      return { colorMap, bumpMap, roughnessMap };
    }

    function createBlueberryGlazeTextures(THREE) {
      const size = 1024;

            const t = (v - 0.78) / 0.12;
            const baseShoulderR = radius * Math.cos(Math.PI * 0.38);
            const baseShoulderY = radius * oblateRatio * Math.sin(Math.PI * 0.38);

            const toothPeak = Math.max(0, star5);

            const crownRadius =
              baseShoulderR * (1.0 - 0.16 * t) +
              radius * 0.055 * toothPeak * Math.sin(t * Math.PI * 0.7) * crownFlare;

            r = crownRadius;
            y = baseShoulderY + crownHeight * Math.sin(t * Math.PI * 0.5);

            const t = (v - 0.90) / 0.10;
            const rimR = radius * Math.cos(Math.PI * 0.38) * 0.84;
            const pitDepth = radius * 0.095;
            const rimY = radius * oblateRatio * Math.sin(Math.PI * 0.38) + radius * 0.075;

            r = rimR * (1.0 - t);
            y = rimY - pitDepth * Math.sin(t * Math.PI * 0.5);

          const x = r * Math.cos(theta);
          const z = r * Math.sin(theta);

          positions.push(x, y, z);
          uvs.push(u, 1.0 - v);
        }
      }

      const stride = uSegs + 1;
      for (let iv = 0; iv < vSegs; iv++) {
        for (let iu = 0; iu < uSegs; iu++) {
          const a = iv * stride + iu;
          const b = a + 1;

          uvs.push(u, v);

      const stride = radialSegs + 1;
      for (let iv = 0; iv < heightSegs; iv++) {

          const a = iv * stride + ir;

      positions.push(0, yBottom, 0);

            vec3 col = mix(warmOrange, warmGold, smoothstep(0.0, 0.45, fresnel));
            col = mix(col, whiteCore, smoothstep(0.32, 0.85, fresnel) * (1.0 - 0.35 * vUv.y));
            float alpha = edgeSoft * smoothstep(0.0, 0.12, vUv.y) * smoothstep(1.0, 0.78, vUv.y);
            gl_FragColor = vec4(col, alpha * 0.96);
          }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const innerFlameMesh = new THREE.Mesh(innerFlameGeo, innerFlameMat);
      innerFlameMesh.position.y = 0.015;
      flamePivot.add(innerFlameMesh);

      const outerFlameGeo = createTeardropFlameGeo(0.47, 0.072);
      const outerFlameMat = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 }
        },
        vertexShader: `
          varying vec2 vUv;
          varying vec3 vNormalView;
          varying vec3 vViewDir;
          uniform float uTime;
          void main() {
            vUv = uv;
            vec3 pos = position;
            float sway = sin(uTime * 6.8 + uv.y * 3.6 + 0.4) * 0.0085 * pow(uv.y, 1.6);
            float flutter = cos(uTime * 11.2 + uv.y * 5.0) * 0.003 * uv.y;
            pos.x += sway + flutter;
            pos.z += flutter * 0.6;
            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            vNormalView = normalize(normalMatrix * normal);
            vViewDir = normalize(-mvPosition.xyz);
            gl_Position = projectionMatrix * mvPosition;
          }
        `,
        fragmentShader: `
          varying vec2 vUv;
          varying vec3 vNormalView;
          varying vec3 vViewDir;
          void main() {
            float fresnel = abs(dot(normalize(vNormalView), normalize(vViewDir)));
            float rimFeather = smoothstep(0.05, 0.68, fresnel);
            vec3 blueBase = vec3(0.42, 0.56, 0.92);
            vec3 goldenMid = vec3(1.0, 0.74, 0.24);
            vec3 amberTip = vec3(0.96, 0.46, 0.10);

            vec3 col = mix(goldenMid, amberTip, smoothstep(0.35, 0.95, vUv.y));
            col = mix(blueBase, col, smoothstep(0.02, 0.16, vUv.y));
            col = mix(amberTip, col, smoothstep(0.15, 0.65, fresnel));

            float alpha = rimFeather * 0.68 * smoothstep(0.0, 0.10, vUv.y) * smoothstep(1.0, 0.72, vUv.y);
            gl_FragColor = vec4(col, alpha);
          }
        `,
        transparent: true,
        depthWrite: false,
        side: THREE.DoubleSide
      });
      const outerFlameMesh = new THREE.Mesh(outerFlameGeo, outerFlameMat);
      flamePivot.add(outerFlameMesh);

      const candleLight = new THREE.PointLight(0xffaa44, 1.45, 5.5, 1.6);
      candleLight.position.copy(flamePivot.position).add(new THREE.Vector3(0, 0.24, 0));
      candleGroup.add(candleLight);

      return {
        candleGroup,
        flamePivot,
        emberMesh,
        candleLight,
        innerFlameMat,
        outerFlameMat
      };
    }

    function buildBlueberryCheesecake(THREE) {
      const cakeGroup = new THREE.Group();
      const rand = createSeededRandom(20261122);

      const crustTex = createGrahamCrustTextures(THREE);
      const creamTex = createCheesecakeBodyTextures(THREE);
      const glazeTex = createBlueberryGlazeTextures(THREE);

      const crustMaterial = new THREE.MeshStandardMaterial({

        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide
      });

      const creamCheeseMaterial = new THREE.MeshPhysicalMaterial({
        map: creamTex.colorMap,
        bumpMap: creamTex.bumpMap,
        bumpScale: 0.0085,
        roughnessMap: creamTex.roughnessMap,
        roughness: 0.48,
        metalness: 0.0,
        sheen: 0.22,
        sheenColor: new THREE.Color(0xfff6e0),
        sheenRoughness: 0.72,
        clearcoat: 0.06,
        clearcoatRoughness: 0.55,
        transparent: false,
        opacity: 1.0,
        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide
      });

      const glazeMaterial = new THREE.MeshPhysicalMaterial({
        map: glazeTex.colorMap,
        bumpMap: glazeTex.bumpMap,
        bumpScale: 0.0045,
        roughness: 0.11,
        metalness: 0.0,
        clearcoat: 1.0,
        clearcoatRoughness: 0.05,
        reflectivity: 0.9,
        transparent: false,
        opacity: 1.0,
        depthWrite: true,
        depthTest: true,
        side: THREE.DoubleSide
      });

      const crustGeo = buildArtisanalCakeLayerGeometry(THREE, {
        radius: 1.59,
        yBottom: 0.0,
        yTop: 0.31,
        radialSegs: 128,
        heightSegs: 14,
        roughAmp: 0.018,
        topLipBulge: 0.004,
        bottomTaper: 0.025,
        seed: 1001
      });
      const crustMesh = new THREE.Mesh(crustGeo, crustMaterial);
      crustMesh.castShadow = true;
      crustMesh.receiveShadow = true;
      cakeGroup.add(crustMesh);

      const creamGeo = buildArtisanalCakeLayerGeometry(THREE, {
        radius: 1.60,
        yBottom: 0.29,
        yTop: 1.39,
        radialSegs: 144,
        heightSegs: 40,
        roughAmp: 0.014,
        topLipBulge: 0.012,
        bottomTaper: 0.006,
        seed: 2002
      });
      const creamMesh = new THREE.Mesh(creamGeo, creamCheeseMaterial);
      creamMesh.castShadow = true;
      creamMesh.receiveShadow = true;
      cakeGroup.add(creamMesh);

      const glazeGeo = buildGlossyGlazeDiscGeometry(THREE, 1.555, 1.375, 0.068);
      const glazeMesh = new THREE.Mesh(glazeGeo, glazeMaterial);
      glazeMesh.receiveShadow = true;
      cakeGroup.add(glazeMesh);

      const berryMaterials = [0, 1, 2, 3].map((idx) => {
        const skinTex = createBlueberrySkinTextures(THREE, idx);
        return new THREE.MeshPhysicalMaterial({
          map: skinTex.colorMap,
          roughnessMap: skinTex.roughnessMap,
          bumpMap: skinTex.bumpMap,
          bumpScale: 0.0032,
          roughness: 0.56,
          metalness: 0.0,
          sheen: 0.55,
          sheenColor: new THREE.Color(0x8faee6),
          sheenRoughness: 0.68,
          clearcoat: 0.14,
          clearcoatRoughness: 0.45,
          transparent: false,
          opacity: 1.0,
          depthWrite: true,
          depthTest: true,
          side: THREE.DoubleSide
        });
      });

      const berryGeos = [
        buildBlueberryGeometry(THREE, 0.222, 0.89, 1.05),
        buildBlueberryGeometry(THREE, 0.236, 0.87, 0.95),
        buildBlueberryGeometry(THREE, 0.208, 0.92, 1.12)
      ];

      const berryPlacements = [
        { r: 1.14, a: 0.06, y: 1.54, s: 1.02, tx: 0.35, tz: -0.22 },
        { r: 1.16, a: 0.48, y: 1.53, s: 0.96, tx: -0.28, tz: 0.42 },
        { r: 1.12, a: 0.91, y: 1.55, s: 1.04, tx: 0.52, tz: 0.18 },
        { r: 1.15, a: 1.34, y: 1.53, s: 0.98, tx: -0.45, tz: -0.35 },
        { r: 1.17, a: 1.76, y: 1.54, s: 1.01, tx: 0.22, tz: 0.58 },
        { r: 1.13, a: 2.18, y: 1.55, s: 0.95, tx: -0.62, tz: 0.15 },
        { r: 1.16, a: 2.60, y: 1.53, s: 1.05, tx: 0.40, tz: -0.48 },
        { r: 1.14, a: 3.02, y: 1.54, s: 0.97, tx: -0.18, tz: 0.54 },
        { r: 1.15, a: 3.44, y: 1.55, s: 1.03, tx: 0.65, tz: 0.20 },
        { r: 1.12, a: 3.86, y: 1.53, s: 0.96, tx: -0.38, tz: -0.52 },
        { r: 1.17, a: 4.28, y: 1.54, s: 1.04, tx: 0.24, tz: 0.44 },
        { r: 1.13, a: 4.70, y: 1.55, s: 0.99, tx: -0.55, tz: -0.18 },
        { r: 1.16, a: 5.12, y: 1.53, s: 1.02, tx: 0.48, tz: 0.36 },
        { r: 1.14, a: 5.54, y: 1.54, s: 0.95, tx: -0.25, tz: -0.46 },
        { r: 1.15, a: 5.94, y: 1.54, s: 1.00, tx: 0.32, tz: 0.28 },

        { r: 0.78, a: 0.25, y: 1.66, s: 1.03, tx: -0.42, tz: 0.26 },
        { r: 0.80, a: 0.74, y: 1.68, s: 0.97, tx: 0.28, tz: -0.50 },
        { r: 0.76, a: 1.22, y: 1.65, s: 1.05, tx: -0.18, tz: 0.44 },
        { r: 0.79, a: 1.70, y: 1.69, s: 0.96, tx: 0.56, tz: 0.22 },
        { r: 0.75, a: 2.18, y: 1.66, s: 1.01, tx: -0.48, tz: -0.30 },
        { r: 0.81, a: 2.66, y: 1.67, s: 1.04, tx: 0.20, tz: 0.60 },
        { r: 0.77, a: 3.14, y: 1.65, s: 0.95, tx: -0.64, tz: 0.12 },
        { r: 0.79, a: 3.62, y: 1.68, s: 1.02, tx: 0.36, tz: -0.38 },
        { r: 0.76, a: 4.10, y: 1.66, s: 0.98, tx: -0.24, tz: 0.52 },
        { r: 0.80, a: 4.58, y: 1.69, s: 1.05, tx: 0.50, tz: -0.16 },
        { r: 0.75, a: 5.06, y: 1.65, s: 0.97, tx: -0.36, tz: -0.44 },
        { r: 0.78, a: 5.54, y: 1.67, s: 1.01, tx: 0.26, tz: 0.40 },
        { r: 0.77, a: 6.00, y: 1.66, s: 0.99, tx: -0.52, tz: 0.24 },

        { r: 0.44, a: 0.12, y: 1.79, s: 1.04, tx: 0.30, tz: 0.38 },
        { r: 0.46, a: 0.90, y: 1.81, s: 0.98, tx: -0.45, tz: -0.22 },
        { r: 0.42, a: 1.68, y: 1.78, s: 1.02, tx: 0.22, tz: -0.48 },
        { r: 0.45, a: 2.46, y: 1.82, s: 1.05, tx: -0.32, tz: 0.42 },
        { r: 0.43, a: 3.24, y: 1.79, s: 0.96, tx: 0.54, tz: 0.18 },
        { r: 0.46, a: 4.02, y: 1.81, s: 1.01, tx: -0.20, tz: -0.52 },
        { r: 0.42, a: 4.80, y: 1.78, s: 1.03, tx: 0.42, tz: 0.32 },
        { r: 0.45, a: 5.58, y: 1.80, s: 0.97, tx: -0.48, tz: 0.20 },

        { r: 0.22, a: 0.55, y: 1.89, s: 1.02, tx: 0.28, tz: -0.24 },
        { r: 0.23, a: 2.65, y: 1.88, s: 0.98, tx: -0.36, tz: 0.30 },
        { r: 0.21, a: 4.75, y: 1.90, s: 1.00, tx: 0.18, tz: 0.42 }
      ];

      berryPlacements.forEach((b, idx) => {
        const geo = berryGeos[idx % berryGeos.length];
        const mat = berryMaterials[(idx + Math.floor(rand() * 2)) % berryMaterials.length];
        const berryMesh = new THREE.Mesh(geo, mat);

        const bx = Math.cos(b.a) * b.r;
        const bz = Math.sin(b.a) * b.r;
        berryMesh.position.set(bx, b.y, bz);

        berryMesh.rotation.order = 'YXZ';
        berryMesh.rotation.y = rand() * Math.PI * 2;
        berryMesh.rotation.x = b.tx;
        berryMesh.rotation.z = b.tz;

        berryMesh.scale.setScalar(b.s);
        berryMesh.castShadow = true;
        berryMesh.receiveShadow = true;
        cakeGroup.add(berryMesh);
      });

      const dropGeo = new THREE.SphereGeometry(0.065, 16, 12);
      dropGeo.scale(1.35, 0.55, 1.35);
      for (let i = 0; i < 16; i++) {
        const a = (i / 16) * Math.PI * 2 + 0.2;
        const r = 0.96 + (i % 3) * 0.14;
        const drop = new THREE.Mesh(dropGeo, glazeMaterial);
        drop.position.set(Math.cos(a) * r, 1.435, Math.sin(a) * r);
        drop.rotation.y = rand() * Math.PI;
        cakeGroup.add(drop);
      }

      const candleAssembly = buildWavySilverCandle(THREE);
      cakeGroup.add(candleAssembly.candleGroup);

      return { cakeGroup, candleAssembly };
    }

    async function initApp() {
      const THREE = await loadThreeCore();

      const container = document.getElementById('canvas-container');
      function getViewportSize() {
        const w = container.clientWidth || window.innerWidth || 360;
        const h = container.clientHeight || window.innerHeight || 360;
        return { w, h };
      }
      const initSize = getViewportSize();

      // Transparent WebGLRenderer so index.html background shows seamlessly behind the 3D cake
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true,
        powerPreference: 'default'
      });
      renderer.setClearColor(0x000000, 0);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(initSize.w, initSize.h);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.04;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = null;

      // Studio IBL reflections for glossy blueberry glaze & metallic silver candle
      const pmremGenerator = new THREE.PMREMGenerator(renderer);
      const envScene = createStudioEnvironmentScene(THREE);
      const envRT = pmremGenerator.fromScene(envScene, 0.04);
      scene.environment = envRT.texture;
      scene.environmentIntensity = 0.56;

      const camera = new THREE.PerspectiveCamera(
        34,
        initSize.w / initSize.h,
        0.05,
        100
      );

      const controls = createBuiltInOrbitController(THREE, camera, renderer.domElement);

      const hemiLight = new THREE.HemisphereLight(0xffffff, 0xf2ece4, 0.62);
      hemiLight.position.set(0, 8, 0);
      scene.add(hemiLight);

      const keyLight = new THREE.DirectionalLight(0xfffdf8, 1.55);
      keyLight.position.set(-2.6, 5.4, 4.4);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 1024;
      keyLight.shadow.mapSize.height = 1024;
      keyLight.shadow.camera.near = 1.0;
      keyLight.shadow.camera.far = 16.0;
      const d = 2.6;
      keyLight.shadow.camera.left = -d;
      keyLight.shadow.camera.right = d;
      keyLight.shadow.camera.top = d;
      keyLight.shadow.camera.bottom = -d;
      keyLight.shadow.bias = -0.0003;
      keyLight.shadow.normalBias = 0.012;
      scene.add(keyLight);

      const fillLight = new THREE.DirectionalLight(0xf3f7ff, 0.78);
      fillLight.position.set(4.5, 3.0, 3.8);
      scene.add(fillLight);

      const rimLight = new THREE.DirectionalLight(0xffffff, 0.95);
      rimLight.position.set(1.2, 4.4, -4.8);
      scene.add(rimLight);

      const bottomLight = new THREE.DirectionalLight(0xfff9f0, 0.52);
      bottomLight.position.set(0, -4.5, 1.2);
      scene.add(bottomLight);

      const { cakeGroup: cheesecake, candleAssembly } = buildBlueberryCheesecake(THREE);
      scene.add(cheesecake);

      const shadowGeo = new THREE.PlaneGeometry(3.85, 3.85);
      shadowGeo.rotateX(-Math.PI / 2);
      const shadowMat = new THREE.MeshBasicMaterial({
        map: createCakeContactShadowTexture(THREE),
        transparent: true,
        depthWrite: false,
        side: THREE.FrontSide
      });
      const shadowMesh = new THREE.Mesh(shadowGeo, shadowMat);
      shadowMesh.position.set(0, -0.002, 0);
      scene.add(shadowMesh);

      const CAMERA_PRESETS = {
        hero: {
          pos: new THREE.Vector3(0.0, 3.85, 7.65),
          target: new THREE.Vector3(0.0, 1.92, 0.0)
        },
        top: {
          pos: new THREE.Vector3(0.0, 7.65, 0.85),
          target: new THREE.Vector3(0.0, 1.65, 0.0)
        },
        side: {
          pos: new THREE.Vector3(7.45, 2.25, 0.35),
          target: new THREE.Vector3(0.0, 1.92, 0.0)
        },
        macro: {
          pos: new THREE.Vector3(1.25, 2.55, 2.45),
          target: new THREE.Vector3(0.18, 1.68, 0.22)
        },
        candle: {
          pos: new THREE.Vector3(0.25, 3.25, 2.55),
          target: new THREE.Vector3(0.0, 3.05, 0.0)
        },
        bottom: {
          pos: new THREE.Vector3(0.65, -4.55, 2.45),
          target: new THREE.Vector3(0.0, 0.15, 0.0)
        }
      };

      camera.position.copy(CAMERA_PRESETS.hero.pos);
      controls.target.copy(CAMERA_PRESETS.hero.target);
      controls.update();

      let camAnim = null;

      function animateCameraTo(presetKey) {
        const key = presetKey === 'reset' ? 'hero' : presetKey;
        const preset = CAMERA_PRESETS[key];
        if (!preset) return;

        camAnim = {
          startPos: camera.position.clone(),
          endPos: preset.pos.clone(),
          startTarget: controls.target.clone(),
          endTarget: preset.target.clone(),
          elapsed: 0,
          duration: 0.85
        };

        document.querySelectorAll('.cam-btn[data-preset]').forEach((btn) => {
          const btnKey = btn.getAttribute('data-preset');
          btn.classList.toggle('active', btnKey === key);
        });
      }

      controls.addEventListener('start', () => {
        camAnim = null;
      });

      document.querySelectorAll('.cam-btn[data-preset]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const preset = btn.getAttribute('data-preset');
          if (preset === 'reset' && controls.autoRotate) {
            setAutoRotate(false);
          }
          animateCameraTo(preset);
        });
      });

      const autoRotateBtn = document.getElementById('toggle-autorotate');
      const autoRotateDot = document.getElementById('autorotate-dot');

      function setAutoRotate(enabled) {
        controls.autoRotate = enabled;
        controls.autoRotateSpeed = 1.65;
        if (enabled) {
          autoRotateBtn.classList.add('active');
          autoRotateDot.classList.remove('bg-slate-300');
          autoRotateDot.classList.add('bg-white');
        } else {
          autoRotateBtn.classList.remove('active');
          autoRotateDot.classList.remove('bg-white');
          autoRotateDot.classList.add('bg-slate-300');
        }
      }

      autoRotateBtn.addEventListener('click', () => {
        setAutoRotate(!controls.autoRotate);
      });

      let isFlameLit = true;
      const flameBtn = document.getElementById('toggle-flame');
      const flameDot = document.getElementById('flame-dot');

      function setFlameLit(lit) {
        isFlameLit = lit;
        candleAssembly.flamePivot.visible = lit;
        candleAssembly.emberMesh.visible = lit;
        candleAssembly.candleLight.visible = lit;
        if (lit) {
          flameBtn.classList.add('active');
          flameDot.classList.remove('bg-slate-300');
          flameDot.classList.add('bg-amber-300');
        } else {
          flameBtn.classList.remove('active');
          flameDot.classList.remove('bg-amber-300');
          flameDot.classList.add('bg-slate-300');
        }
      }

      flameBtn.addEventListener('click', () => {
        setFlameLit(!isFlameLit);
      });

      function updateSize() {
        const { w, h } = getViewportSize();
        if (w <= 0 || h <= 0) return;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
        renderer.render(scene, camera);
      }

      if (typeof ResizeObserver !== 'undefined') {
        const ro = new ResizeObserver(() => updateSize());
        ro.observe(container);
      }
      window.addEventListener('resize', updateSize);
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) updateSize();
      });

      renderer.render(scene, camera);
      hideLoader();

      const clock = new THREE.Clock();
      function animate() {
        requestAnimationFrame(animate);
        const dt = Math.min(clock.getDelta(), 0.05);
        const elapsed = clock.elapsedTime;

        if (isFlameLit) {
          candleAssembly.innerFlameMat.uniforms.uTime.value = elapsed;
          candleAssembly.outerFlameMat.uniforms.uTime.value = elapsed;

          const flicker =
            1.0 +
            0.035 * Math.sin(elapsed * 9.2) +
            0.022 * Math.cos(elapsed * 15.7) +
            0.012 * Math.sin(elapsed * 23.4);
          candleAssembly.flamePivot.scale.set(
            1.0 - (flicker - 1.0) * 0.35,
            flicker,
            1.0 - (flicker - 1.0) * 0.35
          );
          candleAssembly.candleLight.intensity = 1.42 * flicker;
        }

        if (camAnim) {
          camAnim.elapsed += dt;
          const t = Math.min(1, camAnim.elapsed / camAnim.duration);
          const ease = 1 - Math.pow(1 - t, 3);

          camera.position.lerpVectors(camAnim.startPos, camAnim.endPos, ease);
          controls.target.lerpVectors(camAnim.startTarget, camAnim.endTarget, ease);

          if (t >= 1) {
            camAnim = null;
          }
        }

        controls.update();
        renderer.render(scene, camera);
      }

      animate();
    }

    initApp().catch((err) => {
      console.error('Blueberry Cheesecake 3D Viewer initialization error:', err);
      if (location.protocol === 'file:') {
        showError('HTMLファイルを直接開くとブラウザ制限で3D表示がブロックされます。Live ServerまたはGitHub Pagesから開いてください。');
      } else {
        showError('3Dモデルの読み込みに失敗しました（' + (err && err.message ? err.message : '通信エラー') + '）。ページを再読み込みしてお試しください。');
      }
    });
  </script>
